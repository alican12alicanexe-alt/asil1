# fourtrack - a four-track main line, and crossovers between the lines.
#
# Every layout so far has kept each train on the road it started on. A train
# could take a loop, or a branch, or be held at a junction, but it could never
# *change lines*. This one can:
#
#            ___________________________________________ UP FAST
#           /
#   _______/___________________________________________ UP SLOW
#                              crossover
#
# A crossover is a connection between two running lines out on the plain line,
# and it is what the Norwich schematic is full of. Here the up slow joins the up
# fast at km 17 and the down fast joins the down slow at km 17: the moves a
# semi-fast service needs to call at Beta on the slow line and then run fast to
# Gamma.
#
# Both ends have to be a block boundary - a signal has to be able to stand there
# and a route has to be able to end there - so the block plan is drawn to fit the
# connections rather than the other way round. That is what happens on the
# ground, and `builder.py` does it by splitting each stretch at the connection
# before dividing it into blocks.
#
# The lines a crossover connects must run the **same way**. Up to down is not a
# crossover in this model, it is wrong-line running: the train would be going
# against the direction the down line is signalled for, which needs bidirectional
# working and is not modelled. The builder refuses it rather than building
# something that looks right and is not.
#
# Beta has platforms on the slow lines only. That is how a four-track station is
# usually built - the fasts run through non-stop with no platform at all - and it
# is what makes the crossover necessary rather than decorative.

name: fourtrack

defaults:
  platform_zone_m: 1200
  block_length_m: 2000
  max_speed_kmh: 160
  stop_margin_m: 40

stations:
  - {id: ALPHA, name: Alpha, km: 0.0}
  - {id: BETA,  name: Beta,  km: 14.0}
  - {id: GAMMA, name: Gamma, km: 30.0}

tracks:
  # The fast lines do not serve Beta at all, so no platform zone is emitted
  # there and they run through as plain line - which is the point of them.
  - id: UF
    direction: up
    y: 0.0
    max_speed_kmh: 160
    block_length_m: 2000
    # 160 km/h needs 1525 m to brake in, and a train running *through* a
    # platform zone meets its exit signal at speed. 1200 m would be unsignalable
    # on a fast line, which --check says plainly if this is left at the default.
    platform_zone_m: 1800
    serves: [ALPHA, GAMMA]

  - id: US
    direction: up
    y: 0.75
    max_speed_kmh: 120
    block_length_m: 1500
    serves: [ALPHA, BETA, GAMMA]

  - id: DS
    direction: down
    y: 1.5
    max_speed_kmh: 120
    block_length_m: 1500
    serves: [GAMMA, BETA, ALPHA]

  - id: DF
    direction: down
    y: 2.25
    max_speed_kmh: 160
    block_length_m: 2000
    # 160 km/h needs 1525 m to brake in, and a train running *through* a
    # platform zone meets its exit signal at speed. 1200 m would be unsignalable
    # on a fast line, which --check says plainly if this is left at the default.
    platform_zone_m: 1800
    serves: [GAMMA, ALPHA]

crossovers:
  # Up slow to up fast, beyond Beta: a semi-fast that has called at Beta joins
  # the fast line here and runs on to Gamma. `km` is where it leaves the first
  # line; it reaches the second `length_m` further on.
  - id: XO_UP
    from: US
    to: UF
    km: 17.0
    length_m: 400
    max_speed_kmh: 70

  # Down fast to down slow, on the approach to Beta, so a down semi-fast can drop
  # off the fast line to call there. The down lines are chained the other way, so
  # km 17 is still Gamma-side of Beta.
  - id: XO_DN
    from: DF
    to: DS
    km: 17.0
    length_m: 400
    max_speed_kmh: 70

platforms:
  - {id: ALPHA_UF, station: ALPHA, track: UF, length_m: 250}
  - {id: ALPHA_US, station: ALPHA, track: US, length_m: 250}
  - {id: ALPHA_DS, station: ALPHA, track: DS, length_m: 250}
  - {id: ALPHA_DF, station: ALPHA, track: DF, length_m: 250}

  # Slow lines only. A fast train has no platform to stop at here even if it
  # wanted one, which is exactly the arrangement that makes four-tracking work.
  - {id: BETA_US, station: BETA, track: US, length_m: 250}
  - {id: BETA_DS, station: BETA, track: DS, length_m: 250}

  - {id: GAMMA_UF, station: GAMMA, track: UF, length_m: 250}
  - {id: GAMMA_US, station: GAMMA, track: US, length_m: 250}
  - {id: GAMMA_DS, station: GAMMA, track: DS, length_m: 250}
  - {id: GAMMA_DF, station: GAMMA, track: DF, length_m: 250}
