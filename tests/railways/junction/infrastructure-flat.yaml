# junction, laid out flat - the branch on the far side of the main line.
#
# Identical to infrastructure.yaml in every respect except one: where the branch
# sits. Here it is beyond the down main, so a branch train reaching the up main
# has to get across the down main to do it.
#
#   infrastructure.yaml            infrastructure-flat.yaml
#
#   BR_UP  ‾‾\                     UP    ────────────●───────
#   UP     ───●──────              DN    ──────────╳─────────
#   DN     ──────────╲             BR_UP ─────────╱──────────
#   BR_DN            ‾‾            BR_DN ──────╲─────────────
#
#   nothing crosses anything       the up branch crosses the down main,
#                                  and the down branch crosses the up branch
#
# Where two lines cross on the level like that it is a **diamond**. No train
# changes lines there and there are no points - but two trains cannot be on a
# crossing at once, so every branch train takes the down main away from the down
# main's own trains for as long as it is going over. That is the entire cost of a
# flat junction, and it is why grade separation gets built.
#
# The crossings are not declared. They are worked out from the drawing: a link
# ramping from one alignment to another crosses exactly the tracks whose
# alignment lies between them. Run `--check` and they are listed.
#
# scenario-flyover.yaml uses this same layout with `grade_separated: true` on the
# up branch connection, which is a flyover carrying it over the down main. Same
# trains, same timetable, same everything else - so the difference between the
# two runs is the cost of the diamond, measured.

name: junction-flat

defaults:
  # 1250 m rather than a round 1200: a platform road is a block section like any
  # other, and a train running through one at 140 km/h has to be able to stop at
  # its exit signal from a yellow at the entry. That takes 1080 m of braking, the
  # 39 m the brake spends building up, the driver's two seconds of reaction and
  # the standing margin - 1222 m in all, which 1200 m did not cover.
  platform_zone_m: 1250
  block_length_m: 1800
  max_speed_kmh: 140
  stop_margin_m: 40

stations:
  - {id: ALPHA, name: Alpha, km: 0.0}
  - {id: BETA,  name: Beta,  km: 14.0}
  - {id: GAMMA, name: Gamma, km: 30.0}
  - {id: HALT,  name: Halt,  km: 6.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [ALPHA, BETA, GAMMA]

  - id: DN
    direction: down
    y: 1.4
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [GAMMA, BETA, ALPHA]

  # Beyond the down main. To reach the up main this has to cross it.
  - id: BR_UP
    direction: up
    y: 2.4
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [HALT, BETA]
    junction:
      track: UP
      at: BETA
      length_m: 700
      max_speed_kmh: 60

  # Beyond the up branch, so the down connection crosses the up branch line.
  # Real flat double junctions do exactly this, and it is a second reason they
  # are expensive: the two branch connections conflict with each other as well
  # as with the main line.
  - id: BR_DN
    direction: down
    y: 3.2
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [BETA, HALT]
    junction:
      track: DN
      at: BETA
      length_m: 700
      max_speed_kmh: 60

platforms:
  - {id: ALPHA_1, station: ALPHA, track: UP, length_m: 250}
  - {id: ALPHA_2, station: ALPHA, track: DN, length_m: 250}
  - {id: BETA_1, station: BETA, track: UP, length_m: 250}
  - {id: BETA_2, station: BETA, track: DN, length_m: 250}
  - {id: GAMMA_1, station: GAMMA, track: UP, length_m: 250}
  - {id: GAMMA_2, station: GAMMA, track: DN, length_m: 250}
  - {id: HALT_1, station: HALT, track: BR_UP, length_m: 160, max_speed_kmh: 100}
  - {id: HALT_2, station: HALT, track: BR_DN, length_m: 160, max_speed_kmh: 100}
