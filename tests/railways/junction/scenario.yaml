# junction - where the order trains are taken in starts to matter.
#
#   python run.py scenarios/junction                     watch it
#   python run.py scenarios/junction --check             the route table
#   python run.py scenarios/junction --headless --events | grep route_refused
#   python run.py scenarios/junction --compare           every ETCS level
#
# corridor3 and metro are linear railways. Every train is behind or in front of
# every other, the interlocking only ever asks whether the road ahead is clear,
# and better signalling means trains can run closer together. This line asks a
# different question, and it is the question real capacity studies are about.
#
# At Beta a single-track branch converges onto the up main at a trailing point,
# and the down main throws off to the branch at a facing point. Beta has one
# platform road each way. So a branch train and a main line train can want the
# same piece of railway at the same moment, and the interlocking has to refuse
# one of them:
#
#     route_refused  BU1  R_BETA_1_from_BR_UP_JN: PT_UP_13400_T locked to
#                         UP_007 by R_BETA_1_from_UP_007, set for MU1
#
# That refusal is correct and safe. It is also the whole problem, because nothing
# in this simulator *decided* that the main line train should go first. It went
# first because it asked first, and the branch train - shorter, slower, and with
# further to go over the junction - waits.
#
# A junction is where capacity is actually lost on a network, and the reason is
# visible here: the conflict is not between two trains wanting the same *block*,
# it is between two trains wanting the same *point*, and a point is occupied for
# far longer than it is a train's length. Watch the schematic and the branch DMU
# stands on the junction link with the whole main line clear in front of it.
#
# Every ETCS level does the same thing, and `--compare` shows it: moving block
# helps not at all here. Distance separation shortens the gap between trains
# going the same way, and this is not that problem. What this needs is a
# decision about which train goes first - which is Phase 5, and why this scenario
# had to be built before it.

name: junction
description: "Double-track main line with a branch converging at Beta - the first layout where two trains want the same points and something has to choose."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 5400
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  # A route request is made this far out, or this long before a booked departure.
  # At a junction the lead is a real dispatching lever rather than a detail:
  # ask earlier and a train claims the points sooner, which is the crudest
  # possible priority rule and the baseline anything cleverer has to beat.
  route_request_distance_m: 2500
  route_request_lead_s: 60

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0
  stop_tolerance_m: 1.0

view:
  title: "junction - branch and main line competing for Beta"
  speed: 30
