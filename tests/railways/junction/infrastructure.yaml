# junction - a double-track main line with a branch joining it at Beta.
#
# corridor3 and metro are both *linear*: every train on a track is behind or in
# front of every other, and the only question the interlocking ever has to answer
# is whether the road ahead is clear. This line asks the other question. At Beta a
# single-track branch converges onto the up main, and a branch service and a main
# line service can arrive wanting the same piece of railway at the same moment.
#
# That is where capacity is actually lost on a real network, and it is the first
# place in this project where the order trains are taken in is a *decision*
# rather than a consequence. The interlocking will refuse the second request; who
# should have made the first one is a question nothing here can answer yet, and
# that is the point of building it.
#
# Schematically:
#
#   ALPHA ------------------ BETA ------------------ GAMMA        UP   y = 0.0
#   ALPHA ------------------ BETA ------------------ GAMMA        DN   y = 1.4
#                           /    \
#                  BR_UP __/      \__ BR_DN                       branch
#                        |          |
#                      HALT      HALT                             y = -1.3 / 2.7
#
# The branch is modelled as two single tracks rather than one bidirectional one,
# which keeps every segment one-way as everywhere else here. BR_UP runs Halt into
# Beta and joins the up main; BR_DN leaves the down main at Beta and runs back to
# Halt. Both attach at Beta's platform zone, so the points sit exactly where a
# signalling schematic would draw them.

name: junction

defaults:
  # 1250 m rather than a round 1200: a platform road is a block section like any
  # other, and a train running through one at 140 km/h has to be able to stop at
  # its exit signal from a yellow at the entry. That takes 1080 m of braking, the
  # 39 m the brake spends building up, the driver's two seconds of reaction and
  # the standing margin - 1222 m in all, which 1200 m did not cover.
  platform_zone_m: 1250
  block_length_m: 1800
  max_speed_kmh: 140
  stop_margin_m: 40

stations:
  - {id: ALPHA, name: Alpha, km: 0.0}
  - {id: BETA,  name: Beta,  km: 14.0}
  - {id: GAMMA, name: Gamma, km: 30.0}
  # The branch terminus. Its km places it on the schematic rather than measuring
  # a real distance: the branch is drawn below the main line, running back
  # towards Alpha, which is how a branch is normally drawn.
  - {id: HALT,  name: Halt,  km: 6.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [ALPHA, BETA, GAMMA]

  - id: DN
    direction: down
    y: 1.4
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [GAMMA, BETA, ALPHA]

  # The branch, joining the up main at Beta. `junction` says where it attaches;
  # that Beta is this track's *last* call is what makes it a joining move, and so
  # a trailing point - the one a train must never be allowed to run through set
  # against it.
  - id: BR_UP
    direction: up
    y: -1.3
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [HALT, BETA]
    junction:
      track: UP
      at: BETA
      length_m: 700          # the connecting road, worked at reduced speed
      max_speed_kmh: 60

  # And leaving the down main at Beta. Beta is this track's *first* call, which
  # makes it a diverging move and so a facing point - the kind that decides which
  # road a train takes, and the reason facing points are locked before a train is
  # allowed to approach them.
  - id: BR_DN
    direction: down
    y: 2.7
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [BETA, HALT]
    junction:
      track: DN
      at: BETA
      length_m: 700
      max_speed_kmh: 60

platforms:
  - {id: ALPHA_1, station: ALPHA, track: UP, length_m: 250}
  - {id: ALPHA_2, station: ALPHA, track: DN, length_m: 250}

  # Beta has one road each way. Deliberately: with a bay platform for the branch
  # the conflict would disappear, and the conflict is what is being studied.
  - {id: BETA_1, station: BETA, track: UP, length_m: 250}
  - {id: BETA_2, station: BETA, track: DN, length_m: 250}

  - {id: GAMMA_1, station: GAMMA, track: UP, length_m: 250}
  - {id: GAMMA_2, station: GAMMA, track: DN, length_m: 250}

  - {id: HALT_1, station: HALT, track: BR_UP, length_m: 160, max_speed_kmh: 100}
  - {id: HALT_2, station: HALT, track: BR_DN, length_m: 160, max_speed_kmh: 100}
