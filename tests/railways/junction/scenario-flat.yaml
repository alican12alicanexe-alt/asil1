# The flat junction - the branch crosses the down main on the level.
#
#   python run.py scenarios/junction/scenario-flat.yaml --check
#   python run.py scenarios/junction/scenario-flat.yaml --headless
#   python run.py scenarios/junction/scenario-flat.yaml           (watch it)
#
# Same timetable as scenario.yaml, same trains, same signalling. The only thing
# that changes is where the branch sits: beyond the down main instead of beside
# the up main, so a branch train reaching the up main has to cross the down main
# to get there.
#
# Nothing about that crossing is a set of points. It is a diamond - two lines
# crossing on the level, no connection between them - and the only rule is that
# two trains cannot be on it at once. So a branch train going over takes the
# down main away from down trains for as long as it takes, and a down train on
# the diamond keeps the branch train standing.
#
# Compare against scenario-flyover.yaml, which is the identical railway with the
# up branch carried over the down main instead of across it. The difference
# between the two is the price of the level crossing, in seconds.
#
# On this timetable, per train:
#
#     mean journey    flyover 1003 s    flat 1062 s     +59 s
#     restrained      flyover 2441 s    flat 4011 s   +1570 s
#
# and the interesting part is *who* pays. Not the branch train that does the
# crossing - it asks first, gets the road, and loses nothing. The down main
# express, which has nothing to do with the branch at all, loses 160 s; the
# down branch, whose connection crosses the up branch, loses 76 s.
#
#     MU  +0 s     BU  +0 s     BD  +76 s     MD  +160 s
#
# But +59 s is the *worst* phasing, not the answer. Run
# `python scenarios/junction/_sweep_phase.py` and the branch service is moved
# across a whole six-minute interval:
#
#     best  +0 s   mean  +9 s   worst  +59 s
#
# Eight of the twelve phasings cost nothing at all, because the conflicting
# moves simply miss each other. That is why flat junctions survive on real
# networks, and why the case for rebuilding one is argued against a whole
# timetable rather than against a layout. It is also a cost that does not show
# up in any of these numbers: the timetable has to be *designed around* the
# junction, so the trains cannot be put where they would otherwise go.

name: junction-flat
description: "The junction laid out flat, so the up branch crosses the down main on the level - and every branch train takes the down line away from it."

infrastructure: infrastructure-flat.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 5400
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2500
  route_request_lead_s: 60

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0
  stop_tolerance_m: 1.0

view:
  title: "junction - flat, the branch crosses the down main"
  speed: 30
