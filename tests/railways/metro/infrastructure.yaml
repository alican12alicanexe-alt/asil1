# metro - a 12 km, six-station urban line built for distance separation.
#
# corridor3 is a main line: long blocks, high speed, a loop for overtaking. This
# is the other kind of railway, and the one moving block was actually invented
# for. Three things about it matter:
#
#   low speed        90 km/h, and braking distance goes with the square of it.
#                    At 25 m/s a metro unit needs 284 m to stop; at 12 m/s it
#                    needs 65 m. Fixed block cannot exploit that - a block is the
#                    same length whatever speed the train is doing - but moving
#                    block can, which is why the gain here is far larger than on
#                    a fast open line.
#   short trains     120 m, so the space a train actually occupies is small next
#                    to the 600 m section protecting it.
#   stations close   2.2 - 2.6 km apart, and every train calls at every one. The
#                    binding constraint on a metro is not open-line headway, it
#                    is how quickly a platform can be reoccupied - and that is
#                    exactly where the two systems differ most.
#
# The block sections below exist for two reasons only: so that the same timetable
# can be run under fixed block and ETCS Levels 1-2 for comparison, and so Hybrid
# Level 3 has trackside train detection sections to subdivide. Under full moving
# block they bound nothing.

name: metro

defaults:
  # Braking distance from 90 km/h with a 1.1 m/s2 service brake is 284 m; add
  # reaction and the standing margin and a section must be at least ~347 m.
  # 500 m for the platform zone, 600 m on the open line - short, as urban blocks
  # are, because capacity is the whole point of the line.
  platform_zone_m: 500
  block_length_m: 600
  max_speed_kmh: 90
  stop_margin_m: 20

stations:
  - {id: HARBOUR,    name: Harbour,    km: 0.0}
  - {id: MARKET,     name: Market,     km: 2.2}
  - {id: CENTRAL,    name: Central,    km: 4.6}
  - {id: UNIVERSITY, name: University, km: 7.0}
  - {id: PARKSIDE,   name: Parkside,   km: 9.4}
  - {id: AIRPORT,    name: Airport,    km: 12.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 90
    block_length_m: 600
    serves: [HARBOUR, MARKET, CENTRAL, UNIVERSITY, PARKSIDE, AIRPORT]

  - id: DN
    direction: down
    y: 1.4
    max_speed_kmh: 90
    block_length_m: 600
    serves: [AIRPORT, PARKSIDE, UNIVERSITY, CENTRAL, MARKET, HARBOUR]

platforms:
  # One island platform per station, one face each way. No loops and no
  # overtaking: on a metro every train makes every stop, so there is nothing to
  # overtake and no way to recover a late train except by running closer behind
  # it. That is precisely the situation distance separation is good at.
  - {id: HARBOUR_1,    station: HARBOUR,    track: UP, length_m: 160}
  - {id: HARBOUR_2,    station: HARBOUR,    track: DN, length_m: 160}
  - {id: MARKET_1,     station: MARKET,     track: UP, length_m: 160}
  - {id: MARKET_2,     station: MARKET,     track: DN, length_m: 160}
  - {id: CENTRAL_1,    station: CENTRAL,    track: UP, length_m: 160}
  - {id: CENTRAL_2,    station: CENTRAL,    track: DN, length_m: 160}
  - {id: UNIVERSITY_1, station: UNIVERSITY, track: UP, length_m: 160}
  - {id: UNIVERSITY_2, station: UNIVERSITY, track: DN, length_m: 160}
  - {id: PARKSIDE_1,   station: PARKSIDE,   track: UP, length_m: 160}
  - {id: PARKSIDE_2,   station: PARKSIDE,   track: DN, length_m: 160}
  - {id: AIRPORT_1,    station: AIRPORT,    track: UP, length_m: 160}
  - {id: AIRPORT_2,    station: AIRPORT,    track: DN, length_m: 160}
