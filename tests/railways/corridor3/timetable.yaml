# corridor3 timetable - a clock-face half-hourly pattern, repeated three times.
#
# Up direction, per 10 minutes:
#   :00  stopper  Alpha - Beta (loop, 4 min connection dwell) - Gamma
#   :02  fast     Alpha - Gamma, non-stop, passing the stopper at Beta
#
# The two-minute interval is deliberate. It puts the 140 km/h fast close enough
# behind the 120 km/h stopper that it is repeatedly checked down by yellow
# signals on the way to Beta - braking to about 60 km/h and re-accelerating each
# time the signal clears. That concertina is the characteristic capacity cost of
# mixed-speed traffic under fixed block, and it is the behaviour later ERTMS
# levels are meant to reduce.
#
# The overtake at Beta is the other half of the story: it is the cheapest way to
# raise the capacity of a mixed-speed line, and it only works because the loop
# road is a separate block from the through platform. Once the stopper is inside
# the loop, the fast gets a green and runs through at line speed.
#
# Down direction runs a plain stopping service every 10 minutes for contrast.
#
# Booked times are quoted so they parse as strings, not as sexagesimal numbers.

stock:
  - id: EMU_FAST
    name: Fast EMU
    length_m: 200
    max_speed_kmh: 140
    max_accel: 0.9
    service_brake: 0.7
    emergency_brake: 1.2
    # ETCS fitment. Both types here are fully fitted, so the comparison between
    # signalling systems is a clean like-for-like. tests/test_etcs.py runs a
    # deliberately mixed fleet to check Hybrid Level 3 degrades gracefully.
    etcs_level: l2
    tims: true

  - id: EMU_STOP
    name: Stopping EMU
    length_m: 160
    max_speed_kmh: 120
    max_accel: 1.0
    service_brake: 0.75
    emergency_brake: 1.2
    etcs_level: l2
    tims: true

services:
  # ---------------------------------------------------------------- up stoppers
  - id: S1
    name: 0700 Alpha - Gamma stopping
    stock: EMU_STOP
    departure: "07:00:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:00:00", dwell_s: 30}
      - {station: BETA,  platform: BETA_3,  arrival: "07:06:45", departure: "07:11:00", dwell_s: 240}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:20:30", dwell_s: 60}

  - id: S2
    name: 0710 Alpha - Gamma stopping
    stock: EMU_STOP
    departure: "07:10:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:10:00", dwell_s: 30}
      - {station: BETA,  platform: BETA_3,  arrival: "07:16:45", departure: "07:21:00", dwell_s: 240}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:30:30", dwell_s: 60}

  - id: S3
    name: 0720 Alpha - Gamma stopping
    stock: EMU_STOP
    departure: "07:20:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:20:00", dwell_s: 30}
      - {station: BETA,  platform: BETA_3,  arrival: "07:26:45", departure: "07:31:00", dwell_s: 240}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:40:30", dwell_s: 60}

  # ----------------------------------------------------------------- up expresses
  - id: F1
    name: 0702 Alpha - Gamma fast
    stock: EMU_FAST
    departure: "07:02:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:02:00", dwell_s: 30}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:16:26", dwell_s: 60}

  - id: F2
    name: 0712 Alpha - Gamma fast
    stock: EMU_FAST
    departure: "07:12:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:12:00", dwell_s: 30}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:26:26", dwell_s: 60}

  - id: F3
    name: 0722 Alpha - Gamma fast
    stock: EMU_FAST
    departure: "07:22:00"
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:22:00", dwell_s: 30}
