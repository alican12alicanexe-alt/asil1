  # -------------------------------------------------------------- down stoppers
  - id: D1
    name: 0705 Gamma - Alpha stopping
    stock: EMU_STOP
    departure: "07:05:00"
    calls:
      - {station: GAMMA, platform: GAMMA_2, departure: "07:05:00", dwell_s: 30}
      - {station: BETA,  platform: BETA_2,  arrival: "07:14:30", departure: "07:16:30", dwell_s: 90}
      - {station: ALPHA, platform: ALPHA_2, arrival: "07:23:00", dwell_s: 60}

  - id: D2
    name: 0715 Gamma - Alpha stopping
