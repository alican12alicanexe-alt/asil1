# corridor3, worked hard: twelve up services at a 90-second interval.
#
# The point of this timetable is that it asks for more than fixed block can give.
# The blocks on this line are 1500-2250 m, so a fixed-block headway is roughly
# two blocks plus a train length at line speed - about 80-120 seconds. Booking
# trains 90 seconds apart therefore sits right on that limit, and under
# conventional signalling or ETCS Level 2 the trains bunch: each one is checked
# down behind the one in front and arrives late.
#
# Distance-based separation does not have that limit. Moving block needs only
# braking distance plus a safety margin plus the train's length - about 1380 m,
# or 35 seconds at 140 km/h - so the same trains run unimpeded. Hybrid Level 3
# lands in between, at the granularity of its virtual sub-sections.
#
# Run it with:
#   python run.py scenarios/corridor3/scenario-intensive.yaml --compare
#
# The default corridor3 timetable is deliberately *not* like this. At a two-minute
# interval the line is well below capacity, and there Level 2 captures essentially
# all the available benefit while moving block adds nothing - which is itself the
# right answer, and the reason a capacity claim needs the traffic stated with it.

stock:
  - id: EMU_FAST
    name: Fast EMU
    length_m: 200
    max_speed_kmh: 140
    max_accel: 0.9
    service_brake: 0.7
    emergency_brake: 1.2
    etcs_level: l2
    tims: true

services:
  - id: I01
    name: intensive 01
    stock: EMU_FAST
    departure: "07:00:00"
    ready_lead_s: 40
    calls:
      - {station: ALPHA, platform: ALPHA_1, departure: "07:00:00", dwell_s: 20}
      - {station: GAMMA, platform: GAMMA_1, arrival: "07:14:00", dwell_s: 30}

