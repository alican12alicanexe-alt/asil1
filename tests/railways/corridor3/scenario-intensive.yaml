# corridor3 at a 90-second interval - the capacity experiment.
#
# Same infrastructure as scenario.yaml, twelve up services instead of nine mixed
# ones, booked closer together than fixed block can deliver. This is the scenario
# that separates the ETCS levels from each other; the default one is below
# capacity and does not.
#
#   python run.py scenarios/corridor3/scenario-intensive.yaml --compare
#   python run.py scenarios/corridor3/scenario-intensive.yaml   (watch it bunch)

name: corridor3-intensive
description: "corridor3 worked at a 90-second interval, above what fixed block can deliver, to separate the ETCS levels."

infrastructure: infrastructure.yaml
timetable: timetable-intensive.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 3600
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0
  stop_tolerance_m: 1.0

view:
  title: "corridor3 intensive - 90 second interval"
  speed: 30
