# junction, laid out with a flyover - the flat layout, grade separated.
#
# Character for character identical to infrastructure-flat.yaml except for one
# line: `grade_separated: true` on the up branch connection. That is a flyover
# carrying the up branch over the down main instead of across it, and it is the
# only difference between the two runs.
#
# Everything else is held constant on purpose - same alignments, same block
# lengths, same trains, same timetable - so whatever `--compare` shows between
# scenario-flat.yaml and scenario-flyover.yaml is the cost of the diamond and
# nothing else. That is the shape a junction remodelling business case takes.
#
# Note the down branch connection is *not* grade separated here. It still crosses
# the up branch line, which is realistic: a flyover is normally built for the
# move that conflicts with the main line, not for every move at the junction.

name: junction-flyover

defaults:
  # 1250 m rather than a round 1200: a platform road is a block section like any
  # other, and a train running through one at 140 km/h has to be able to stop at
  # its exit signal from a yellow at the entry. That takes 1080 m of braking, the
  # 39 m the brake spends building up, the driver's two seconds of reaction and
  # the standing margin - 1222 m in all, which 1200 m did not cover.
  platform_zone_m: 1250
  block_length_m: 1800
  max_speed_kmh: 140
  stop_margin_m: 40

stations:
  - {id: ALPHA, name: Alpha, km: 0.0}
  - {id: BETA,  name: Beta,  km: 14.0}
  - {id: GAMMA, name: Gamma, km: 30.0}
  - {id: HALT,  name: Halt,  km: 6.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [ALPHA, BETA, GAMMA]

  - id: DN
    direction: down
    y: 1.4
    max_speed_kmh: 140
    block_length_m: 1800
    serves: [GAMMA, BETA, ALPHA]

  # Beyond the down main. To reach the up main this has to cross it.
  - id: BR_UP
    direction: up
    y: 2.4
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [HALT, BETA]
    junction:
      track: UP
      at: BETA
      length_m: 700
      max_speed_kmh: 60
      # The flyover. Nothing else in this file changes.
      grade_separated: true

  # Beyond the up branch, so the down connection crosses the up branch line.
  # Real flat double junctions do exactly this, and it is a second reason they
  # are expensive: the two branch connections conflict with each other as well
  # as with the main line.
  - id: BR_DN
    direction: down
    y: 3.2
    max_speed_kmh: 100
    block_length_m: 1600
    serves: [BETA, HALT]
    junction:
      track: DN
      at: BETA
      length_m: 700
      max_speed_kmh: 60

platforms:
  - {id: ALPHA_1, station: ALPHA, track: UP, length_m: 250}
  - {id: ALPHA_2, station: ALPHA, track: DN, length_m: 250}
  - {id: BETA_1, station: BETA, track: UP, length_m: 250}
  - {id: BETA_2, station: BETA, track: DN, length_m: 250}
  - {id: GAMMA_1, station: GAMMA, track: UP, length_m: 250}
  - {id: GAMMA_2, station: GAMMA, track: DN, length_m: 250}
  - {id: HALT_1, station: HALT, track: BR_UP, length_m: 160, max_speed_kmh: 100}
  - {id: HALT_2, station: HALT, track: BR_DN, length_m: 160, max_speed_kmh: 100}
