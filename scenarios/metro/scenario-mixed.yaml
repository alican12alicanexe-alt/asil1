# metro at 75 seconds with two units that cannot confirm their integrity.
#
#   python run.py scenarios/metro/scenario-mixed.yaml --compare
#
# The migration case. U06 and D06 run older stock that reports its position but
# has no train integrity monitoring, so the trackside cannot trust where the rear
# of the train is - part of it may have been left behind. Moving block therefore
# refuses to follow them by distance and falls back to treating them as occupying
# a whole detection section, which is Level 2 separation imposed on the trains
# behind by one train in front.
#
# The result is worth reading per train rather than as a mean. Restrained seconds
# and delay at Airport, under moving block:
#
#   U01 - U05    0 s, on time      the legacy unit is not yet in front of them
#   U06          0 s, on time      this *is* the legacy unit, and it runs fine
#   U07         66 s, +13 s        the train immediately behind it
#   U08 - U12   62, 58, 34, 16, 16 s      +10, +7, +4, +4, +4 s
#
# Two conclusions, neither of them about signalling. The unfitted unit pays
# nothing - the entire cost of not fitting it falls on the services behind. And
# the delay never washes out: it settles at four seconds rather than returning to
# zero, because a plan booked at the achievable headway has no slack anywhere to
# absorb it. Whether to fit a unit is therefore not a decision about that unit.
#
# Note too that every one of those delays is inside the 30-second tolerance the
# summary calls "on time", so --headless reports nothing wrong. What this costs
# is not punctuality, it is capacity, and it shows up only in the restrained
# seconds - which is worth remembering before reading a punctuality figure as
# evidence that a railway has headroom.
#
# Hybrid Level 3 is not a free rescue here, which is worth knowing before quoting
# it as one. At its default four sub-sections per section - 150 m on this line -
# it is coarser than a moving-block authority on a platform approach and comes
# out slightly worse rather than better. Finer sub-sections fix that; see
# scenario.yaml for the measured sweep.

name: metro-mixed
description: "The metro flight with two units lacking train integrity monitoring - what mixed fitment costs, and who pays for it."

infrastructure: infrastructure.yaml
timetable: timetable-mixed.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 5400
  strict: false

signalling:
  system: etcs_moving_block
  safety_margin_m: 100

driver:
  reaction_time_s: 1.5
  safety_margin_m: 20.0
  stop_tolerance_m: 1.0

view:
  title: "metro - mixed fitment, two units without TIMS"
  speed: 20
