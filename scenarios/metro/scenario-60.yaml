# metro at 60 seconds - the headway nothing delivers.
#
#   python run.py scenarios/metro/scenario-60.yaml --compare
#
# The counterweight to scenario.yaml. There, moving block delivers a plan that
# fixed block cannot, and it would be easy to read that as "distance separation
# removes the limit". It does not. It moves the limit somewhere else, and this
# scenario is where it lands: dwell time plus the time a following train needs to
# close up and berth. No train control system can shorten either.
#
# Run it and moving block is 51 s late per service. Better than fixed block's
# 163 s, but late - and the way to fix it is platform-edge doors and passenger
# flow, not signalling.

name: metro-60
description: "The metro flight booked at a 60-second headway, which no train control system on the ladder delivers - the constraint has moved to dwell time."

infrastructure: infrastructure.yaml
timetable: timetable-60.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 5400
  strict: false

signalling:
  system: etcs_moving_block
  safety_margin_m: 100

driver:
  reaction_time_s: 1.5
  safety_margin_m: 20.0
  stop_tolerance_m: 1.0

view:
  title: "metro - 60 second headway, past the limit"
  speed: 20
