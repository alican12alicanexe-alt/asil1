# metro with a held door at the busiest station.
#
#   python run.py scenarios/metro/scenario-disrupted.yaml --propagation
#   python run.py scenarios/metro/scenario-disrupted.yaml --propagation --compare
#
# The same 75-second flight as scenario.yaml, which moving block delivers exactly
# and fixed block does not. One thing goes wrong: U05 stands 90 seconds over its
# booked dwell at Central. Ninety seconds - a door held, one passenger, nothing
# anybody would write up.
#
# This is the counterpart to corridor3's incident, and the interesting half. That
# line has a loop road, mixed speeds and a timetable with supplement in it, so a
# four-minute stand costs one other train 49 seconds. A metro has none of those.
# Every train calls everywhere, there is nothing to overtake, and the plan is
# booked at the achievable headway with no slack anywhere - so the only place the
# lost time can go is into the trains behind.
#
# The figure to look at is `per s primary`: seconds of knock-on delay bought by
# each second of the incident. On corridor3 it is around 0.2. Here it is several
# times that, and none of the train control systems change it much, because
# what is missing is not information - it is somewhere to put the delay.
#
# That is the honest setup for a traffic management system, and the reason
# Phase 5 comes after this one. Nothing in the simulator can currently *decide*
# anything: the dispatcher runs the plan as written and the interlocking answers
# yes or no. Recovering this incident needs a decision - hold a train back, skip
# a stop, turn one short - and that is what there is now something to test.

name: metro-disrupted
description: "The 75-second metro flight with U05 standing 90 seconds over at Central - delay propagation on a railway with no slack anywhere."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0
  start_time: "06:58:00"
  duration_s: 5400
  strict: false

disruptions:
  - kind: dwell_overrun
    service: U05
    station: CENTRAL
    seconds: 90
    reason: door held at the busiest station

signalling:
  system: etcs_moving_block
  safety_margin_m: 100

driver:
  reaction_time_s: 1.5
  safety_margin_m: 20.0
  stop_tolerance_m: 1.0

view:
  title: "metro - U05 held 90 s at Central"
  speed: 20
