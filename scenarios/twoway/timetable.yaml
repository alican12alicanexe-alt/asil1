# twoway timetable - generated, do not edit by hand.
#
#   python scenarios/twoway/_generate_timetable.py
#
# 6 trains each way, booked 360 seconds apart, taking the roads at each station
# in turn. Every booked time is what that service achieves with the railway to
# itself, over its own roads.
#
# Nothing here uses a crossover. They are for when something is in the way - see
# scenario-blocked.yaml.

stock:
  - id: EMU
    name: Line unit
    length_m: 160
    max_speed_kmh: 100
    max_accel: 1.0
    service_brake: 0.8
    emergency_brake: 1.2
    etcs_level: none
    tims: false

