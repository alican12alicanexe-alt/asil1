# twoway - depotline's geography with an up line and a down line, and the
# crossovers that let a train work either one.
#
#                 WEST DEPOT ---- KINGSFORD ---- MARLOWE ---- ASHDOWN ---- EAST DEPOT
#                   km 0             km 12         km 30        km 48        km 60
#
#   UP  <>           2 roads        2 plat        3 plat       2 plat        2 roads
#   DN  <>           2 roads        2 plat        3 plat       2 plat        2 roads
#
# Both lines are signalled both ways end to end - <> is the direction of travel
# each is normally worked in, not the only one it can be.
#
# depotline is one line, so every train is in front of or behind every other one
# and the only way past is through a station. This is the same sixty kilometres
# with a line each way - and, more to the point, with the connections between
# them that a railway uses when something is in the way.
#
# WORKING A LINE IN BOTH DIRECTIONS
#
# A crossover joins two lines that run the same way: up fast to up slow. An up
# line to a down line is a different thing, because a train taking it then runs
# against the direction that line is usually worked in. Real railways do it -
# it is what single-line working under a pilotman is - and it is what the four
# connections at the bottom of this file are for - one either side of each
# station, so every platform has a road both ways. Neither direction is the
# wrong one: which way the stretch is set is a state of the railway, like which
# way a point lies.
#
# Nothing here declares which stretch is reversible. A line is worked both ways
# exactly where a train can get onto the opposite line AND off it again, so the
# stretch is whatever the crossovers bracket - and each NEIGHBOURING PAIR of
# them brackets its own, here km 9.0-13.9, 13.5-32.4 and 32.0-51.4, which puts
# each of the three intermediate stations inside one. The end of the line
# brackets a stretch as well, because it is a way off the other line: a train
# stops there, and whatever it does next it does in the other direction, on its
# own line's road. So km 0.0-9.4 and 51.0-60.0 are worked both ways too, and
# that is what gives the two depots a road each way. That is how a real railway
# reads too: bidirectional signalling is provided between the crossovers, and
# between the outermost crossover and the buffer stops, because those are the
# only places it is any use - and each stretch is its own section,
# because giving the whole line to one direction at a time is a working method
# for a branch, not for this.
#
# Over that stretch each line gets a second set of block sections laid over the
# same rails, running the other way, named after the originals with `_R` on the
# end. Each of them is declared to CROSS the block underneath it, and crossing
# blocks already mean something here: the interlocking will not set a route over
# one while anything holds or occupies the other. So a train may be signalled up
# the down line, and while it is, nothing can be signalled down it. That is the
# whole of the safety case, and it is the same mechanism that polices a flat
# junction.
#
# Each crossover below is one piece of pointwork and four movements over it: up
# train onto the down line and back, down train onto the up line and back. The
# scenario does not write them out - it draws the crossover, and the four fall
# out of it.
#
# Nothing in the timetable names them. They are there for when the road ahead is
# blocked - see scenario-blocked.yaml, where Marlowe's up platform is closed and
# the up trains find their own way round.

name: twoway

defaults:
  platform_zone_m: 1200
  block_length_m: 1500
  max_speed_kmh: 120
  stop_margin_m: 30

stations:
  - {id: WDEPOT,    name: West Depot, km: 0.0}
  - {id: KINGSFORD, name: Kingsford,  km: 12.0}
  - {id: MARLOWE,   name: Marlowe,    km: 30.0}
  - {id: ASHDOWN,   name: Ashdown,    km: 48.0}
  - {id: EDEPOT,    name: East Depot, km: 60.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 100
    block_length_m: 1500
    serves: [WDEPOT, KINGSFORD, MARLOWE, ASHDOWN, EDEPOT]

  - id: DN
    direction: down
    y: 0.4
    max_speed_kmh: 100
    block_length_m: 1500
    serves: [EDEPOT, ASHDOWN, MARLOWE, KINGSFORD, WDEPOT]

platforms:
  # The two main roads sit next to each other at y 0.0 and y 0.4, and the loops
  # fan OUTWARD from them - the up loops negative, the down loops positive - so
  # the drawing reads the way a track diagram does, with the through roads in the
  # middle and the platform roads either side. The negative offsets on the up
  # roads are deliberate, not a sign error.
  #
  # Two roads at each depot on each line: a depot road is held for four minutes
  # and one of them would set the headway on its own.
  - {id: WDEPOT_UP_1, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: WDEPOT_UP_2, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.4}
  - {id: WDEPOT_DN_1, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: WDEPOT_DN_2, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.4}
  - {id: EDEPOT_UP_1, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: EDEPOT_UP_2, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.4}
  - {id: EDEPOT_DN_1, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: EDEPOT_DN_2, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.4}

  # The intermediate stations. Road 1 is the main road at 60 km/h, the loops 40,
  # as on depotline.
  - {id: KINGSFORD_UP_1, station: KINGSFORD, track: UP, length_m: 220, max_speed_kmh: 60, y_offset: 0.0}
  - {id: KINGSFORD_UP_2, station: KINGSFORD, track: UP, length_m: 220, max_speed_kmh: 40, y_offset: -0.4}
  - {id: KINGSFORD_DN_1, station: KINGSFORD, track: DN, length_m: 220, max_speed_kmh: 60, y_offset: 0.0}
  - {id: KINGSFORD_DN_2, station: KINGSFORD, track: DN, length_m: 220, max_speed_kmh: 40, y_offset: 0.4}

  - {id: MARLOWE_UP_1, station: MARLOWE, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: MARLOWE_UP_2, station: MARLOWE, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.4}
  - {id: MARLOWE_UP_3, station: MARLOWE, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.8}
  - {id: MARLOWE_DN_1, station: MARLOWE, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: MARLOWE_DN_2, station: MARLOWE, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.4}
  - {id: MARLOWE_DN_3, station: MARLOWE, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.8}

  - {id: ASHDOWN_UP_1, station: ASHDOWN, track: UP, length_m: 220, max_speed_kmh: 60, y_offset: 0.0}
  - {id: ASHDOWN_UP_2, station: ASHDOWN, track: UP, length_m: 220, max_speed_kmh: 40, y_offset: -0.4}
  - {id: ASHDOWN_DN_1, station: ASHDOWN, track: DN, length_m: 220, max_speed_kmh: 60, y_offset: 0.0}
  - {id: ASHDOWN_DN_2, station: ASHDOWN, track: DN, length_m: 220, max_speed_kmh: 40, y_offset: 0.4}

crossovers:
  # Four crossovers between the up line and the down line, one either side of
  # each station. Each is usable in all four ways - a train off either line onto
  # the other, and back - so these are what let a train be worked round the far
  # side of a station on the opposite line and put back on its own beyond, and
  # what gives every platform a road in both directions.
  #
  # Both ends of a connection have to be clear of a platform zone: a zone is one
  # block section from throat to throat, and a connection cannot land in the
  # middle of one - there is no boundary there for it to join at.
  # `type` picks the pointwork:
  #
  #   single    one diagonal. `from` and `to` read in the direction of
  #             increasing km, so UP -> DN is drawn \ and DN -> UP is drawn /.
  #             The hand matters: a single crossover takes a train one way
  #             across and the way back needs the other hand somewhere else,
  #             which is why a diversion is drawn as a \ ... / pair.
  #   scissors  both diagonals over one piece of pointwork, so a train can
  #             cross either way at the same place.
  #   diamond   two lines crossing on the level, joining nothing. No train
  #             changes lines; what it costs is that two trains cannot be on it
  #             at once.
  #
  # Scissors everywhere here, so BOTH directions can be diverted. Make any of
  # them `type: single` and it becomes one hand: with UP -> DN at the west and
  # DN -> UP at the east, up trains get a diversion and down trains do not.
  #
  # Four of them, one either side of each station, because a platform is only
  # workable in both directions if a train can get onto that road AND off it
  # again. Each neighbouring PAIR is its own section, so a train being worked
  # the other way past Kingsford does not shut the line at Ashdown:
  #
  #   9.0 .. 13.9   brackets Kingsford
  #   13.5 .. 32.4  brackets Marlowe
  #   32.0 .. 51.4  brackets Ashdown
  #
  #   0.0 .. 9.4    brackets West Depot, against the end of the line
  #   51.0 .. 60.0  brackets East Depot, against the end of the line
  #
  # The depots need no connection beyond them, and by geometry could not have
  # one: a depot sits at the end of the line. The buffer stops do that
  # connection's job, since a train that has run to the end of the line leaves
  # in the other direction whatever it does next - so km 0.0-9.4 and 51.0-60.0
  # are worked both ways as well, bracketed by the outermost crossover at one
  # end and by the end of the line at the other, and every depot road has a
  # signal each way.
  - {id: XO_KINGSFORD_W, from: UP, to: DN, km: 9.0,  length_m: 400, max_speed_kmh: 60, type: scissors}
  - {id: XO_WEST,        from: UP, to: DN, km: 13.5, length_m: 400, max_speed_kmh: 60, type: scissors}
  - {id: XO_EAST,        from: DN, to: UP, km: 32.0, length_m: 400, max_speed_kmh: 60, type: scissors}
  - {id: XO_ASHDOWN_E,   from: DN, to: UP, km: 51.0, length_m: 400, max_speed_kmh: 60, type: scissors}
