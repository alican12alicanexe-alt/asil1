# depotline - a single-track line between two depots, worked by fixed block.
#
# Run it:
#   python run.py scenarios/depotline              (live schematic)
#   python run.py scenarios/depotline --headless   (no window, prints a summary)
#   python run.py scenarios/depotline --check      (signal spacing and the plan)
#
#   WEST DEPOT ---- KINGSFORD ---- MARLOWE ---- ASHDOWN ---- EAST DEPOT
#     km 0            km 5          km 13        km 21        km 27
#     1 road         2 plat        4 plat       3 plat        1 road
#
# One running line and no way past except through a station. The flight is
# homogeneous - eight trains of one type, all calling everywhere on the main
# road, all dwelling the same - because that is what makes a headway a property
# of the railway rather than of the traffic mix. Mix a fast unit in among
# stoppers and the binding constraint becomes the speed difference and where the
# loops happen to be; run one train type and what is left is the signalling and
# the station dwell.
#
# HEADWAY, MEASURED
#
# `python scenarios/depotline/_sweep_headway.py` books the same flight at every
# interval from four minutes down to one, rebuilding the plan from the unimpeded
# run times each time so it is always workable in isolation:
#
#     headway   restrained   mean delay   worst arrival
#       150 s          0 s        0.0 s           0 s     <- the line holds this
#       135 s          0 s       37.8 s          81 s
#       120 s          0 s       95.4 s         193 s
#        90 s          0 s      203.0 s         406 s
#        60 s          0 s      308.0 s         616 s
#
#     150 s = 24 trains an hour.
#
# The restraint column is the finding, and it is zero all the way down. No train
# on this line is ever checked by a signal, however tightly the flight is booked.
# The queue does not form on the road, it forms at the platform: a train cannot
# be let into a station road until the train in front has cleared it, and it is
# that - reoccupation, not signal spacing - that sets the interval. Block spacing
# out on the open line would allow 74-100 s, and never gets the chance to.
#
# WHAT THE DEPOTS COST
#
# The depots had one road each to begin with, and this line worked 15 trains an
# hour. A depot road is 1200 m of block taken at 40 km/h, so a train held one for
# 2 x 1200 m plus its own 160 m at 11 m/s - 230 seconds - before its dwell was
# even counted, and `--check` reported exactly that before anything was run.
# Nothing out on the line could get past it.
#
# A second road in each depot, used by alternate trains, took the headway from
# 240 s to 150 s: fifteen trains an hour to twenty-four, for two turnouts and no
# signalling at all. The binding constraint moved to the station roads, where a
# train stands for 45 seconds and holds 1200 m of block while it does.
#
# The same lever is still there and unpulled: Marlowe has four roads, Ashdown
# three and Kingsford two, and a flight that used them alternately rather than
# queueing for the main road would go further again. It would not be free - the
# loops are worked at 60 km/h, so a train routed through one is slower and has to
# be booked as such - and that trade, road capacity against road speed, is the
# one a real timetable is written around.

name: depotline
description: "A 27 km single-track line between two depots, three stations with 2, 4 and 3 platform roads, three-aspect fixed block, and fast units overtaking stoppers in the loops at Marlowe."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0                 # seconds per tick; microscopic
  start_time: "06:57:00"
  duration_s: 4200        # 70 minutes, enough for every service to complete
  strict: false           # true makes a block-exclusivity violation raise

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2000
  route_request_lead_s: 60

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0   # standing distance kept short of a signal at danger
  stop_tolerance_m: 1.0

view:
  title: "depotline - West Depot / Kingsford / Marlowe / Ashdown / East Depot"
  speed: 30               # simulated seconds per real second at startup
