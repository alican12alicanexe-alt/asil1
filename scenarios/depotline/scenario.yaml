# depotline - a single-track line between two depots, worked by fixed block.
#
# Run it:
#   python run.py scenarios/depotline              (live schematic)
#   python run.py scenarios/depotline --headless   (no window, prints a summary)
#   python run.py scenarios/depotline --check      (signal spacing and the plan)
#
#   WEST DEPOT ------ KINGSFORD ------ MARLOWE ------ ASHDOWN ------ EAST DEPOT
#     km 0               km 12            km 30          km 48          km 60
#    2 roads            2 plat           4 plat         3 plat         2 roads
#      |<-- 12 km -->|<--- 18 km --->|<--- 18 km --->|<-- 12 km -->|
#
# One running line and no way past except through a station. The flight is
# homogeneous - eight trains of one type, all calling everywhere on the main
# road, all dwelling the same - because that is what makes a headway a property
# of the railway rather than of the traffic mix. Mix a fast unit in among
# stoppers and the binding constraint becomes the speed difference and where the
# loops happen to be; run one train type and what is left is the signalling and
# the station dwell.
#
# THE ALL-GREEN HEADWAY
#
# The interval this line is booked at is not the one at which trains can just
# about stop in time. It is the one at which they never have to slow down at all.
# Braking for a yellow is a degraded state - it means the plan has already failed
# - so what is worth measuring is the all-green headway: the closest two trains
# follow each other with the second never seeing anything but green.
#
# `--check` gives the theoretical figure from signal spacing alone. A train uses
# up two block sections rather than the one it is standing in, because a signal
# shows green only when the section beyond the one it protects is clear too:
#
#     all-green headway = (2 block sections + train length + sighting) / v
#
# It is reported as a range, and the number that matters is the TOP of it. A line
# is only as close-worked as its worst section, so 101-253 s does not mean this
# railway will do 101 s. Read it as: the running line's worst section is 149 s
# (ML_022, an 1867 m block between Marlowe and Ashdown), and the 253 s belongs to
# the depot roads, which is survivable only because the two roads at each end are
# used by alternate trains.
#
# `python scenarios/depotline/_sweep_headway.py` books the same flight at every
# interval from five minutes down to one, rebuilding the plan from the unimpeded
# run times each time so it is always workable in isolation:
#
#     headway   restrained   mean delay   worst arrival
#       240 s          0 s        0.0 s           0 s
#       210 s          0 s        0.0 s           0 s     <- all-green
#       195 s        112 s        7.0 s           8 s     <- degraded
#       165 s        336 s       21.0 s          24 s
#       135 s        906 s       73.4 s         145 s
#       120 s       1436 s      130.4 s         256 s
#        90 s       2389 s      235.4 s         466 s
#        60 s       3221 s      342.1 s         678 s
#
#     210 s = 17.1 trains an hour, against a worst section of 149 s.
#
# Restraint is reported over the 111 seconds a single train pays with the railway
# entirely to itself. That toll is not congestion: every signal here is
# controlled, so it stands at danger until the interlocking sets a route over it,
# and a train alone is checked on each approach exactly as a train in traffic is.
# Counting it would put the same floor under every row and hide the thing being
# looked for.
#
# WHAT WORKING ENTIRELY BY ROUTE COSTS
#
# This line had automatic signals on the plain line until recently: a signal with
# no points under it had nothing for a signaller to set, so it worked itself off
# track occupancy and sat green on an empty railway. It is now worked entirely by
# route - see `automatic_signals: false` below - and nothing comes off until the
# interlocking has set it. An empty line is a line of reds, and the greens are a
# two-signal window that travels ahead of each train:
#
#     start, empty         .........................................................
#     mid-run              ....Gy.Gy.y...Gy.Gy..Gy..Gy..............................
#     end, trains gone     .........................................................
#
# That is the honest picture of a route-set railway, and it costs 45 seconds of
# headway:
#
#     Marlowe-Ashdown blocks   automatic block   worked entirely by route
#            1800 m (shipped)      165 s  21.8 tph      210 s  17.1 tph
#            1200 m                150 s  24.0 tph      195 s  18.5 tph
#
# A flat 45 s either way, so it is not interacting with block length - it is the
# reservation itself. A route holds its block from the moment it is set, two
# signals ahead of the train, until the train has cleared it. An automatic signal
# holds a section only while a train is physically standing in it. The difference
# is two blocks of reservation depth, and that is what the follower pays.
#
# Two signals ahead is the minimum that works, not a tuning choice: a three-aspect
# signal shows green only when the signal beyond it is off, and that one is off
# only if a route has been set through it too. At `route_lookahead: 1` every
# driver on this line runs on yellows and the journey takes 255 s longer. Above
# two, nothing improves.
#
# Below the all-green headway the line does not fail, it degrades - each train a
# little later than the one in front, which is what a real railway does when it is
# booked tighter than it can work.
#
# WHAT THE STATION SPACING COSTS, AND WHAT IT DOES NOT
#
# This line was 27 km with 5-8 km between stations before it was 60 km with
# 12-18 km. Journey time roughly doubled, as it must. The headway moved too, from
# 195 s to 210 s - but not because of the spacing.
#
# `block_length_m` is a target the builder divides evenly into each stretch, so
# the same 1800 m request that produced 1700 m sections over 8 km produces 1867 m
# ones over 18 km. Longer blocks, longer headway. Cut the Marlowe-Ashdown stretch
# back to 1200 m blocks and the measured figure comes back 15 s with nothing else
# touched:
#
#     Marlowe-Ashdown blocks   all-green headway
#            1800 m (shipped)       210 s   17.1 trains/hour
#            1200 m                 195 s   18.5 trains/hour
#
# Station spacing buys journey time. Block length buys headway. They are
# independent, and only the fact that block length is declared as a target rather
# than a count ties them together at all.
#
# WHAT THE DEPOTS COST
#
# The depots had one road each to begin with, and this line worked 15 trains an
# hour. A depot road is 1200 m of block taken at 40 km/h, so a train held one for
# 2 x 1200 m plus its own 160 m at 11 m/s - 230 seconds - before its dwell was
# even counted, and `--check` reported exactly that before anything was run.
# Nothing out on the line could get past it.
#
# A second road in each depot, used by alternate trains, took the headway from
# 240 s to 150 s: fifteen trains an hour to twenty-four, for two turnouts and no
# signalling at all. With that gone the binding constraint moved out onto the
# running line, to the longest open-line block.
#
# Both of those figures were measured while the plain line still worked itself,
# and neither has been re-run since; the depot roads are controlled either way,
# so the comparison holds even though the absolute numbers have moved.
#
# It is worth being clear that the loops are NOT the next lever, tempting as it
# looks that Marlowe has four roads and Ashdown three. `--check` prices them:
#
#     MARLOWE_1  through road, 100 km/h    101 s
#     MARLOWE_2  loop,          60 km/h    169 s
#     ML_022     open line,    100 km/h    149 s   <- what actually binds
#
# A flight that used the loops alternately would put half its trains in a section
# worth 169 s to get out of one worth 149 s, which is a loss. Loops are for
# letting a fast train past a slow one, and this flight is homogeneous - there is
# nothing to overtake. The lever that does work is block length: see the table
# above, where cutting one stretch from 1800 m to 1200 m buys 15 seconds.

name: depotline
description: "A 60 km single-track line between two depots, three stations with 2, 4 and 3 platform roads, and a homogeneous flight of eight units worked by three-aspect fixed block."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0                 # seconds per tick; microscopic
  start_time: "06:57:00"
  duration_s: 6000        # 100 minutes, enough for every service to complete
  strict: false           # true makes a block-exclusivity violation raise

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2000
  route_request_lead_s: 60
  # No automatic signals on this railway. Every signal is controlled and stands
  # at danger until the interlocking sets a route through it, so an empty line is
  # a line of reds and the greens are a window that travels ahead of each train.
  # Set this true for automatic block, where a signal with no points under it
  # works itself off track occupancy and sits green on an empty railway.
  automatic_signals: false
  # How many signals ahead the signaller keeps routes set. Two is the minimum
  # that works: a three-aspect signal shows green only when the signal beyond it
  # is off, and that one is off only if a route has been set through it too. At
  # one, every driver on this line runs on yellows and the journey takes 255 s
  # longer. Above two, nothing improves.
  route_lookahead: 2

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0   # standing distance kept short of a signal at danger
  stop_tolerance_m: 1.0

view:
  title: "depotline - West Depot / Kingsford / Marlowe / Ashdown / East Depot"
  speed: 30               # simulated seconds per real second at startup
