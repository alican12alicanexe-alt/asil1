# depotline - a single-track line between two depots, with three stations on it.
#
#   WEST DEPOT -------- KINGSFORD -------- MARLOWE -------- ASHDOWN -------- EAST DEPOT
#     km 0                 km 12              km 30            km 48            km 60
#    2 roads              2 plat             4 plat           3 plat           2 roads
#      |<--- 12 km --->|<---- 18 km ---->|<---- 18 km ---->|<--- 12 km --->|
#
# Sixty kilometres between the depots, and twelve to eighteen between stations.
# That spacing is the point of the line rather than an incidental of it: a unit
# that tops out at 100 km/h needs about 700 m to get there and a kilometre to
# come back down, so on a five-kilometre hop it is accelerating or braking for
# most of the run and never really cruises. Give it eighteen, and it spends the
# middle two thirds at line speed.
#
# The spacing itself costs no capacity - the headway is set by a block section
# being cleared, and how many sections lie between two stations does not change
# how long any one of them is held. What did cost capacity here is a side effect
# worth knowing about: `block_length_m` is a target that the builder divides
# evenly into each stretch, so asking for 1800 m blocks over 18 km produces 1867 m
# ones where the same request over 8 km produced 1700 m. Bigger blocks, longer
# headway. Stretching this line took it from 150 s to 165 s, and cutting the
# Marlowe-Ashdown stretch back to 1200 m blocks takes it straight back to 150 s.
#
# So: station spacing buys journey time, block length buys headway, and the two
# are independent. It is only the fact that block length is declared as a target
# rather than a count that ties them together at all.
#
# One running line, so every train is behind or in front of every other one and
# the only way past is through a station. That is what the platform roads are
# for: they are parallel roads over the same piece of railway, each its own block
# section, so a train standing in one is not standing in the way of a train
# running through another. Marlowe has four of them and is where the overtaking
# is meant to happen; Ashdown has three and Kingsford two.
#
# The depots at each end are termini with two roads apiece, because from the
# running line's point of view a depot is somewhere trains come from in the
# morning and go back to at night - and how many of them can be got in and out
# per hour is a question about the neck, not about the shed behind it.
#
# Parallel roads need no switch model to be safe. Each is its own block, and the
# single approach block ahead of the divergence can only ever hold one train, so
# two trains can never be presented at the points together. The points and the
# routes over them are derived from this layout rather than declared - see
# core/points.py - and the interlocking will refuse the second request for a
# road that is already promised to somebody.

name: depotline

defaults:
  # A platform road is a block section like any other: a train running through
  # one at line speed meets its exit signal at speed, and that signal can be at
  # danger. So the section has to be long enough to brake in - 911 m at 120 km/h
  # once the brake build-up and the driver's reaction are counted - and 1200 m
  # leaves a margin on it.
  platform_zone_m: 1200
  block_length_m: 1500
  max_speed_kmh: 120
  stop_margin_m: 30

stations:
  - {id: WDEPOT,    name: West Depot, km: 0.0}
  - {id: KINGSFORD, name: Kingsford,  km: 12.0}
  - {id: MARLOWE,   name: Marlowe,    km: 30.0}
  - {id: ASHDOWN,   name: Ashdown,    km: 48.0}
  - {id: EDEPOT,    name: East Depot, km: 60.0}

tracks:
  - id: ML
    direction: up
    y: 0.0
    max_speed_kmh: 120
    block_length_m: 1500
    serves: [WDEPOT, KINGSFORD, MARLOWE, ASHDOWN, EDEPOT]
    block_lengths:
      # Shorter blocks where trains follow each other closely into the
      # overtaking station, longer ones on the open stretch beyond it. The long
      # ones are what binds this line: at 1800 m they come out as 1867 m sections
      # implying 149 s, which is the worst figure anywhere on the running line and
      # within a few seconds of what the flight actually holds. Cut this row to
      # 1200 and the measured headway goes from 165 s to 150 s.
      - {from: KINGSFORD, to: MARLOWE, block_length_m: 1200}
      - {from: MARLOWE,   to: ASHDOWN, block_length_m: 1800}

platforms:
  # The depot necks. Two roads each, worked slowly as depot roads are. One road
  # was what set this line's headway: a train held 1200 m of block at 40 km/h,
  # which is 230 seconds of block occupation before the dwell is even counted,
  # and no amount of signalling out on the line could get past it. Two roads,
  # used alternately, halve it.
  - {id: WDEPOT_1, station: WDEPOT, track: ML, length_m: 220, max_speed_kmh: 40, y_offset: 0.0}
  - {id: WDEPOT_2, station: WDEPOT, track: ML, length_m: 220, max_speed_kmh: 40, y_offset: 0.5}
  - {id: EDEPOT_1, station: EDEPOT, track: ML, length_m: 220, max_speed_kmh: 40, y_offset: 0.0}
  - {id: EDEPOT_2, station: EDEPOT, track: ML, length_m: 220, max_speed_kmh: 40, y_offset: 0.5}

  # Kingsford: a through road and one loop.
  - {id: KINGSFORD_1, station: KINGSFORD, track: ML, length_m: 220, y_offset: 0.0}
  - {id: KINGSFORD_2, station: KINGSFORD, track: ML, length_m: 220, max_speed_kmh: 60, y_offset: 0.5}

  # Marlowe: the overtaking station. Road 1 is the through road at line speed;
  # 2, 3 and 4 are loops, which is why they are slower - points and a shorter
  # radius, exactly as at a real passing place.
  - {id: MARLOWE_1, station: MARLOWE, track: ML, length_m: 240, y_offset: 0.0}
  - {id: MARLOWE_2, station: MARLOWE, track: ML, length_m: 240, max_speed_kmh: 60, y_offset: 0.5}
  - {id: MARLOWE_3, station: MARLOWE, track: ML, length_m: 240, max_speed_kmh: 60, y_offset: 1.0}
  - {id: MARLOWE_4, station: MARLOWE, track: ML, length_m: 240, max_speed_kmh: 40, y_offset: 1.5}

  # Ashdown: a through road and two loops.
  - {id: ASHDOWN_1, station: ASHDOWN, track: ML, length_m: 220, y_offset: 0.0}
  - {id: ASHDOWN_2, station: ASHDOWN, track: ML, length_m: 220, max_speed_kmh: 60, y_offset: 0.5}
  - {id: ASHDOWN_3, station: ASHDOWN, track: ML, length_m: 220, max_speed_kmh: 60, y_offset: 1.0}
