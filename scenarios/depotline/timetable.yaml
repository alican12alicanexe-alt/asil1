# depotline timetable - generated, do not edit by hand.
#
#   python scenarios/depotline/_generate_timetable.py
#
# A flight of 8 trains of one type, all calling at every station, booked 240
# seconds apart, and taking the roads at each station in turn rather than all
# queueing for road 1. Every booked time is what that service actually achieves
# with the railway to itself - over its own roads, since the loops are slower
# than the through road - so the plan is workable on its own and any delay a run
# reports is the signalling failing to deliver it.
#
# 240 seconds is the shortest interval this line will hold. _sweep_headway.py is
# where that number comes from.

stock:
  - id: EMU
    name: Line unit
    length_m: 160
    max_speed_kmh: 100
    max_accel: 1.0
    service_brake: 0.8
    emergency_brake: 1.2
    # No ETCS fitment: lineside signals, read by drivers, which is what fixes
    # the headway this line can work to.
    etcs_level: none
    tims: false

services:

  - id: T01
    name: 07:00 West Depot - East Depot
    stock: EMU
    departure: "07:00:00"
    ready_lead_s: 60
    calls:
      - {station: WDEPOT, platform: WDEPOT_1, departure: "07:00:00", dwell_s: 60}
      - {station: KINGSFORD, platform: KINGSFORD_1, arrival: "07:08:02", departure: "07:08:47", dwell_s: 45}
      - {station: MARLOWE, platform: MARLOWE_1, arrival: "07:20:31", departure: "07:21:16", dwell_s: 45}
