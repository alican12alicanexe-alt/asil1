# capacity2 - what a stop costs, and what taking one out buys.
#
#   python run.py scenarios/capacity2               (live schematic)
#   python run.py scenarios/capacity2 --headless
#   python run.py scenarios/capacity2 --check       (the layout, and the plan)
#   python scenarios/capacity2/_sweep_headway.py    (what the line actually holds)
#
# THE PREVIOUS EXPERIMENT
#
# capacity2 used to be the heterogeneous-fleet sweep. Its finding - that mixing
# train performance costs capacity only if the timetable spends it, and that
# moving block wants L3 with the integrity report on - is in the git history and
# stands. The scenario was retired, and the directory has been reused rather
# than left as a stale copy of a railway two revisions behind the base.
#
# WHAT THIS ONE ASKS
#
# The base is scenarios/capacity: sixty kilometres, three intermediate stations
# fifteen apart, every train calling at all of them. This is the same railway
# with Bramley taken out and nothing else touched - same crossovers at the same
# kilometres, same speed limit profile, same stock, same dwells, same eight
# trains each way. One station less is the only variable.
#
# Two questions come off that.
#
# HOW MUCH OF A HEADWAY IS SPENT ON STOPPING - ANSWERED
#
# A station is where a railway's trains are closest together and slowest, so it
# is usually where the headway is set. Take one of three out and the line has a
# third fewer of those places - but the two that remain are unchanged, and the
# tightest place on a line is what a headway figure measures. Whether the sweep
# would move at all was therefore a real question. It moves, and by the same
# amount under every system:
#
#                        all-green headway        keeps time
#                        base    here    gain     base    here
#   fixed block 3-aspect  255 s   229 s   -26 s    200 s   187 s
#   moving block          121 s    95 s   -26 s     76 s   under 60 s
#   virtual coupling      114 s    88 s   -26 s     69 s   under 60 s
#
# Twenty-six seconds, three times, from three systems that otherwise agree
# about nothing. That is the shape of a cost that belongs to the STOP and not
# to the signalling: a station takes the same twenty-six seconds out of the
# achievable interval whether the trains are kept apart by lineside signals,
# by measured distance or by a radio link to the train in front. Nothing a
# signalling system does gets it back, because it is not a separation problem.
#
# Both cab systems now keep time all the way to 60 s, which is the bottom of
# HEADWAYS - where they stop doing so is below the range this sweep covers.
#
# The other figure that moves is the toll the flight pays with the railway to
# itself under fixed block: 450 s on the base, 300 s here. Exactly a third,
# for exactly the reason it looks like - one controlled station approach in
# three has gone, and every train was being checked at it.
#
# WHETHER A CONVOY CAN LIVE ON A LONGER LEG
#
# The second question is the one this scenario was built for. Under virtual
# coupling two trains close together are meant to run at a steady distance
# apart, and on the base they never do: measured at 90 s headway, a coupled
# pair's gap swings between 178 m and 400 m. The bottom of that swing is always
# a station - the leader brakes for the platform while the follower is still at
# line speed, and once the leader is standing there is nothing left for the
# follower to borrow, which is exactly when relative braking has no benefit to
# give.
#
# Thirty kilometres without a stop is the first stretch on either scenario long
# enough for a pair to settle and stay settled. What happens there is neither
# of the two things that were expected, and it is worth stating plainly.
#
# Booked at 60 s, tracking every linked pair, counting the ticks where one gets
# inside 200 m of the rear of the other, by where on the line it happened:
#
#                     base (Bramley present)      here (Bramley gone)
#     0 -  5 km              128                        128
#    10 - 15 km              188                        162
#    15 - 20 km              112                          -
#    25 - 30 km              166                          -
#    30 - 35 km              160                          -
#    45 - 50 km              206                        152
#    55 - 60 km              136                        134
#
# On the base every one of those bands is next to a station: 15-20 leaving
# Linford, 25-30 and 30-35 either side of Bramley. Take Bramley out and the
# entire thirty-kilometre middle leg is EMPTY. Not a single tick, anywhere in
# it, where two trains got within 200 m of each other. The closest a pair came
# on that leg was 353 m, against 102 m and 114 m on the two outer legs.
#
# So the convoy does not settle on the long leg. It never forms there at all.
#
# THE REASON, WHICH IS THE REAL FINDING
#
# A follower only closes on its leader when the leader is going slower than it
# is. This is a homogeneous fleet: same unit, same power, same brake, same line
# speed. On thirty kilometres of open running there is no speed difference to
# close with, so two trains hold whatever gap the timetable handed them and
# carry it to the far end. The one thing that reliably creates a difference is
# the leader braking for a platform - and that is precisely the moment relative
# braking has nothing left to offer, because a stopped train has no run-on to
# borrow.
#
# Virtual coupling lets trains run closer together. Nothing in it makes them
# GET closer together. Closing up is a speed manoeuvre and this railway has no
# mechanism for one, which is why the convoys were never stable: they were not
# unstable, they were never assembled.
#
# That also disposes of the earlier suspicion. The 650 m speed limit cycle does
# put a coupled pair under two different limits about 60% of the time here, the
# same as on the base - but it is not what stops the convoy forming, because on
# the middle leg nothing gets close enough to be broken up in the first place.
# A line with longer constant-speed stretches would not change this. What would
# is a convoy speed manoeuvre: a bounded closing differential, with the leader
# held back or the follower given headroom to the line speed. That is a change
# to the signalling system, not to a scenario, and it is not made here.
#
# WHAT IS DELIBERATELY NOT FIXED HERE
#
# The speed limit profile. Limits still change roughly every 650 m, which is
# a test pattern rather than a railway and is known to keep a coupled pair
# under two different limits about two thirds of the time. Changing it and
# the station count in the same scenario would leave neither attributable, so
# it stays exactly as the base has it. If the convoy still cannot settle on a
# thirty-kilometre leg, that profile is the next variable to move - in a
# scenario of its own.
#
# HOW TO READ IT AGAINST THE BASE
#
# The outer legs are the control. WDEPOT to LINFORD and CALDER to EDEPOT are
# the same fifteen kilometres of the same railway in both scenarios, over the
# same limits, with the same crossovers. Any figure that moves on those has not
# been moved by the missing station, and something else is going on.

name: capacity2
description: "The base railway with one station taken out of the middle - thirty unbroken kilometres where the base has two fifteens and a stop."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0
  start_time: "06:57:00"
  duration_s: 9000
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2000
  route_request_lead_s: 60
  automatic_signals: false
  route_lookahead: 2

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0

view:
  title: "capacity - the comparison base"
  speed: 20
