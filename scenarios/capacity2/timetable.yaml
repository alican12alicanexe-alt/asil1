# capacity2 timetable - generated, do not edit by hand.
#
#   python scenarios/capacity2/_generate_timetable.py
#
# 8 trains each way, booked 300 seconds apart, taking the roads at each station
# in turn. Two types alternate along each line - normal, fast, normal, fast -
# and every booked time is what that type achieves over those roads with the
# railway to itself.
#
# This is sweep 2: the capacity base with heterogeneous train performance and
# nothing else changed.

stock:
  - id: EMU
    name: Normal unit
    length_m: 160
    max_speed_kmh: 120
    max_accel: 1.0
    service_brake: 0.8
    emergency_brake: 1.2
    etcs_level: none
    tims: false
