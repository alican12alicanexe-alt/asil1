# capacity2 timetable - generated, do not edit by hand.
#
#   python scenarios/capacity2/_generate_timetable.py
#
# 8 trains each way, booked 300 seconds apart, all of them the same unit calling
# everywhere there is to call and taking the roads at each station in turn.
# Every booked time is what that service achieves with the railway to itself,
# over its own roads.
#
# The same flight as the base, with one call fewer: Bramley is not on this
# railway, so the middle leg is thirty kilometres of unbroken running.

stock:
  - id: EMU
    name: Line unit
    length_m: 160
    max_speed_kmh: 120
    max_accel: 0.9
    service_brake: 1.0
    emergency_brake: 1.5
    etcs_level: none
    tims: false

services:

  - id: U01
    name: 07:00 West Depot - East Depot
    stock: EMU
    departure: "07:00:00"
    ready_lead_s: 60
    calls:
      - {station: WDEPOT, platform: WDEPOT_UP_1, departure: "07:00:00", dwell_s: 60}
