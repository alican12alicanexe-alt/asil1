# capacity2 - the same railway with one station taken out of the middle.
#
# A clone of scenarios/capacity with Bramley removed and NOTHING else changed:
# same sixty kilometres, same eight crossovers at the same kilometres, same
# speed limit profile, same stock, same dwells. One station less is the only
# variable, which is what makes the two scenarios comparable line for line.
#
#   WDEPOT           LINFORD                           CALDER           EDEPOT
#   km 0             km 15                             km 45            km 60
#     |----------------|----------------------------------|----------------|
#   UP  <>-------------------------------------------------------------------->
#   DN  <>--------------------------------------------------------------------<
#      X        X     X              X     X              X     X        X
#    km 3      km 12 km 18          km 27 km 33          km 42 km 48    km 57
#
# <> is the direction each line is normally worked in, not the only one it can
# be: both lines are signalled both ways end to end. X is a scissors crossover.
#
# WHAT THIS ONE IS FOR
#
# The base books every train to call everywhere, fifteen kilometres between
# stops. A train that stops every fifteen kilometres spends its journey braking
# and accelerating, and a pair of trains running close together is pulled apart
# at every one of those stops: the leader brakes for the platform while the
# follower is still at line speed, then the leader stands there with nothing
# left for a follower to borrow. Measured on the base under virtual coupling, a
# coupled pair's gap swings from 178 m to 400 m, and the bottom of that swing is
# always a station.
#
# So the question is what happens to that when a stop is taken out. The middle
# leg here is THIRTY kilometres of unbroken running - twice anything on the base
# - which is the first stretch on either scenario long enough for two trains to
# settle to a steady distance apart and stay there.
#
# They do not, and not for the reason expected: booked at 60 s, no pair of
# trains gets within 200 m of each other ANYWHERE on that leg, where the base
# has close approaches either side of Bramley. A follower only closes on a
# leader that is going slower, and on a homogeneous fleet at line speed there
# is no such difference to close with. The full result is at the head of
# scenario.yaml.
#
# WHY BRAMLEY AND NOT A RESPACING
#
# Taking the middle station out leaves legs of 15, 30 and 15 km, which is not
# the even spacing the base argues for at length. That is deliberate. Respacing
# the remaining stations to 20 km each would have been symmetric, but it would
# have moved every station relative to the crossovers and the speed limits, and
# then no figure could be attributed to the missing stop rather than to the new
# geography. Leaving Linford and Calder exactly where the base has them means
# the two outer legs are the same railway in both scenarios and act as the
# control: if a number moves on those, the missing station is not what moved it.
#
# The cost is that the tightest place on the line is still a fifteen-kilometre
# leg, so the headway figures this scenario reports are set by the same
# constraint the base's are. That is the point rather than a flaw - the sweep
# answers "does removing a stop buy headway", and the honest answer to that has
# to come from a line whose binding constraint has not been quietly changed too.
#
# THE CROSSOVERS ARE UNMOVED
#
# All eight, at the same kilometres, including the pair at 27 and 33 that used
# to bracket Bramley. They are renamed XO_MIDLINE_W and XO_MIDLINE_E because a
# crossover cannot be named after a station that is not there, but they are the
# same 900 m of railway in the same place. Keeping them means the reversible
# spans, the block boundaries they impose and the 50 km/h braces over them are
# identical between the two scenarios, so the middle leg differs from the base's
# two middle legs by the stop and by nothing else.
#
# THE REVERSIBLE STRETCHES
#
# A stretch is worked both ways where a train can get onto the other line and
# off it again. Each neighbouring pair of crossovers brackets one, and so does
# each outermost crossover against the end of the line.
#
#    0.0 ..  3.9   brackets West Depot, against the end of the line
#    3.9 .. 12.9   brackets nothing
#   12.9 .. 18.9   brackets Linford
#   18.9 .. 27.9   brackets nothing
#   27.9 .. 33.9   brackets nothing - it used to bracket Bramley
#   33.9 .. 42.9   brackets nothing
#   42.9 .. 48.9   brackets Calder
#   48.9 .. 57.9   brackets nothing
#   57.9 .. 60.0   brackets East Depot, against the end of the line
#
# WHY THE CROSSOVERS ARE 900 m
#
# A crossover puts a block boundary on the main line at each of its ends, so the
# main-line block between them is exactly as long as the crossover. At 120 km/h
# a train needs about 850 m to stop, and a block shorter than that cannot be
# signalled: a train passing a yellow could not stop at the next signal.
#
# NO JUNCTIONS
#
# Nothing branches off this railway, exactly as on the base. Every train that
# starts on it runs the whole length of it, so the only things that can hold a
# train up are the train in front, a platform road and the signalling.

name: capacity2

defaults:
  platform_zone_m: 1200
  block_length_m: 1800
  max_speed_kmh: 120
  stop_margin_m: 30

stations:
  - {id: WDEPOT,  name: West Depot, km: 0.0}
  - {id: LINFORD, name: Linford,    km: 15.0}
  - {id: CALDER,  name: Calder,     km: 45.0}
  - {id: EDEPOT,  name: East Depot, km: 60.0}

