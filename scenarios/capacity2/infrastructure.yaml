# capacity2 - the comparison base, with the line limit raised.
#
# Sixty kilometres, a line each way, three intermediate stations and a depot at
# each end. Everything about it is deliberately plain and deliberately
# symmetric, because its job is to be the railway every other run is measured
# against. If a figure moves between two runs on this layout, the layout is not
# what moved it.
#
#   WDEPOT           LINFORD          BRAMLEY          CALDER           EDEPOT
#   km 0             km 15            km 30            km 45            km 60
#     |----------------|----------------|----------------|----------------|
#   UP  <>-------------------------------------------------------------------->
#   DN  <>--------------------------------------------------------------------<
#         X         X                                  X         X
#       km 10     km 20                              km 40     km 50
#
# <> is the direction each line is normally worked in, not the only one it can
# be: both lines are signalled both ways end to end. X is a scissors crossover.
#
# WHY THE STATIONS ARE EVENLY SPACED
#
# Fifteen kilometres apart, every one of them, and the same dwell at each. A
# capacity figure is a property of the tightest place on the line, so an uneven
# layout answers a question about that one place rather than about the
# signalling. Making every leg identical means the binding constraint is the
# same everywhere, which is what lets the systems be compared against each other
# rather than against the geography.
#
# WHY THE CROSSOVERS ARE 1000 m
#
# A crossover puts a block boundary on the main line at each of its ends, so the
# main-line block between them is exactly as long as the crossover. A block
# shorter than the braking distance from line speed cannot be signalled: a train
# passing a yellow could not stop at the next signal. 400 m would have been more
# realistic and would have left this railway unsignalable from the first run,
# which is no way to start a measurement.
#
# The base gets away with 900 m because its worst stock is a 120 km/h unit
# needing 786 m. The fast unit here needs 939 m from 150, so 900 m blocks would
# have left sixteen sections that a train passing a yellow could not stop in,
# and --check says so. 1000 m is the smallest round figure that clears it. This
# is the one piece of geometry that had to move with the fleet, and it is worth
# knowing when comparing back to the base: four blocks on each line are 100 m
# longer here than they are there.
#
# WHY THE LINE LIMIT IS 150 AND NOT 160
#
# This is the one thing changed from scenarios/capacity, and it is changed in
# service of the fleet rather than for its own sake: at a 120 limit a 160 km/h
# unit is only a 120 km/h unit with better brakes, and the experiment has no
# variable. 150 rather than 160 for two reasons. A train held down by the road
# rather than by itself is the ordinary case on a real railway and the more
# interesting one to signal. And braking distance goes up with the square of
# speed: the 900 m crossover blocks are signalable at 150 and are not at 160,
# so 160 would have meant moving the pointwork, and then the layout would have
# changed too and the experiment would be measuring two things at once.
#
# Everything slower stays exactly where the base put it - loops at 60, depot
# roads at 40, crossovers at 60 - so the only limit that moved is line speed.
#
# THE REVERSIBLE STRETCHES
#
# A stretch is worked both ways where a train can get onto the other line and
# off it again. Each neighbouring pair of crossovers brackets one, and so does
# each outermost crossover against the end of the line - a train that runs to
# the buffer stops leaves in the other direction anyway. Five spans, one per
# station:
#
#    0.0 .. 11.0   brackets West Depot, against the end of the line
#   10.0 .. 21.0   brackets Linford
#   20.0 .. 41.0   brackets Bramley
#   40.0 .. 51.0   brackets Calder
#   50.0 .. 60.0   brackets East Depot, against the end of the line
#
# So every platform road at all five stations has a road each way.
#
# NO JUNCTIONS
#
# Nothing branches off this railway. Every train that starts on it runs the
# whole length of it, so the only things that can hold a train up are the train
# in front, a platform road and the signalling - which is the whole point of a
# comparison base. A junction adds a conflict that belongs to the junction
# rather than to the train control system, and there is nowhere on this layout
# for that conflict to hide a difference between two systems.
#
# The crossovers are not junctions in that sense: they connect the two lines of
# this same railway to each other and lead nowhere else. They are what make both
# lines reversible, and no booked service uses them either.

name: capacity

defaults:
  platform_zone_m: 1200
  block_length_m: 1800
  max_speed_kmh: 150
  stop_margin_m: 30

stations:
  - {id: WDEPOT,  name: West Depot, km: 0.0}
  - {id: LINFORD, name: Linford,    km: 15.0}
  - {id: BRAMLEY, name: Bramley,    km: 30.0}
  - {id: CALDER,  name: Calder,     km: 45.0}
  - {id: EDEPOT,  name: East Depot, km: 60.0}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 150
    block_length_m: 1800
    serves: [WDEPOT, LINFORD, BRAMLEY, CALDER, EDEPOT]

  - id: DN
    direction: down
    y: 0.4
    max_speed_kmh: 150
    block_length_m: 1800
    serves: [EDEPOT, CALDER, BRAMLEY, LINFORD, WDEPOT]

platforms:
  # The through roads sit on the main alignment and the loops fan outward from
  # them - the up loops negative, the down loops positive - so the drawing reads
  # the way a track diagram does, with the through roads in the middle.
  #
  # Road 1 at each intermediate station is a through road at full line speed:
  # a train that is not calling there is not checked for the station. Roads 2
  # and 3 are loops at 60. That is what makes an overtake possible later without
  # the layout having to change.
  - {id: LINFORD_UP_1, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: LINFORD_UP_2, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: LINFORD_UP_3, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: LINFORD_DN_1, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: LINFORD_DN_2, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: LINFORD_DN_3, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  - {id: BRAMLEY_UP_1, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: BRAMLEY_UP_2, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: BRAMLEY_UP_3, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: BRAMLEY_DN_1, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: BRAMLEY_DN_2, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: BRAMLEY_DN_3, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  - {id: CALDER_UP_1, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: CALDER_UP_2, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: CALDER_UP_3, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: CALDER_DN_1, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 150, y_offset: 0.0}
  - {id: CALDER_DN_2, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: CALDER_DN_3, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  # Two roads at each depot on each line: a depot road is held for a minute at
  # each end of the day's work and one of them would set the headway on its own.
  - {id: WDEPOT_UP_1, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: WDEPOT_UP_2, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.4}
  - {id: WDEPOT_DN_1, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: WDEPOT_DN_2, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.4}
  - {id: EDEPOT_UP_1, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: EDEPOT_UP_2, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 40, y_offset: -0.4}
  - {id: EDEPOT_DN_1, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.0}
  - {id: EDEPOT_DN_2, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 40, y_offset: 0.4}

crossovers:
  # Four scissors crossovers, one either side of the middle three stations, each
  # usable in all four ways. These are what make both lines reversible: see the
  # spans listed at the top of this file.
  - {id: XO_LINFORD_W, from: UP, to: DN, km: 10.0, length_m: 1000, max_speed_kmh: 60, type: scissors}
  - {id: XO_LINFORD_E, from: UP, to: DN, km: 20.0, length_m: 1000, max_speed_kmh: 60, type: scissors}
  - {id: XO_CALDER_W,  from: DN, to: UP, km: 40.0, length_m: 1000, max_speed_kmh: 60, type: scissors}
  - {id: XO_CALDER_E,  from: DN, to: UP, km: 50.0, length_m: 1000, max_speed_kmh: 60, type: scissors}
