# ring-grade - the circuit, with a gradient profile on it.
#
# scenarios/ring is dead level: every segment carries grade_permille 0, so the
# only thing between a train and line speed is the speed profile and whatever
# is in front of it. This is the same railway with the ground put back under
# it. Stations, kilometres, blocks, crossovers, horseshoes, platforms and the
# speed profile are byte-for-byte those of infrastructure.yaml. Ten gradient
# entries per road are the whole difference.
#
#   python run.py scenarios/ring/scenario-grade.yaml --check
#   python run.py scenarios/ring/scenario-grade.yaml --compare
#   python scenarios/ring/_generate_grade.py            (rebuild the timetable)
#
# THE UNITS ARE RISE PER THOUSAND
#
# 15 means fifteen metres up in a thousand along - 1.5 %, or 1 in 66.7 in the
# way a British gradient post writes it. Not a percentage and not a fraction:
# the builder refuses anything past 100 per thousand precisely because that is
# the mistake the units invite.
#
# WHAT IS REALISTIC
#
# Ruling gradients on real railways, roughly:
#
#   heavy freight route          6 - 10     kept low on purpose; a loaded
#                                           train is what sets the limit
#   conventional main line      10 - 16     TCDD's conventional network mostly
#                                           sits here
#   high speed                  25 - 35     an EMU climbs what a freight cannot
#   suburban and metro          30 - 40     short trains, high power, and often
#                                           in tunnel where the alignment has
#                                           to dive under something
#
# The distribution matters as much as the maximum. A real profile is NOT
# uniform between its limits: most of a line is gently graded, following a
# valley or a shelf, and the steep stretches are few, short, and where the line
# has to cross something. So this profile is weighted the same way - a ruling
# gradient of 15, a mean of 7.6 across the ten stretches, two shelves at 1 and
# 2 that are effectively level, and the two steepest stretches placed where the
# line was already slow.
#
# THE PROFILE, AND WHY IT SITS WHERE IT DOES
#
# The gradients were not scattered. They were fitted to the speed profile that
# was already there, because on a real railway the two come from the same
# ground: easy country gets a fast, straight, gently-graded alignment, and
# difficult country gets curves and banks together.
#
# A gradient describes the run between two stations, so it is applied to the
# open line and not to the platform zones: each 700 m zone stays level, and a
# stretch is therefore graded over its length less 700 m. The heights below are
# read off the built model rather than worked out from the table.
#
#   stretch                 km    limits over it    grade    height at the far end
#   Akyurt 1                                                     0 m   (the valley)
#     -> Macunköy 1        2.5    60, 70              +8        +14 m
#     -> Gölbaşı 1         3.1    80, 50             +15        +50 m  <- the bank
#     -> Teknopark 1       2.8    80, 80              +2        +55 m  <- a shelf
#     -> Akyurt 2          3.8    60, 80, 80          +6        +73 m  <- the summit
#     -> Macunköy 2        2.5    80, 50              -4        +66 m
#     -> Gölbaşı 2         3.5    80, 60             -11        +35 m
#     -> Teknopark 2       2.8    80, 80              -1        +33 m  <- a shelf
#     -> Akyurt 3          4.0    50, 70, 80, 60     -14        -13 m  <- the descent
#     -> Macunköy 3        3.1    80, 80              +3         -6 m
#     -> Gölbaşı 3         2.7    60, 80, 50         +12        +18 m
#
# Read it as a line that climbs out of one valley over a ridge and drops into
# the next. The two 80-only stretches - Gölbaşı 1 to Teknopark 1 and Gölbaşı 2
# to Teknopark 2 - are the two flattest, at 2 and 1. The two steepest, the 15
# up to Gölbaşı 1 and the 14 down into Akyurt 3, both have a 50 km/h section in
# them, which is what a curve on a bank looks like.
#
# The relief is 86 m from Akyurt 3 at the bottom to Akyurt 2 at the top, over a
# line 31 km long. That is ordinary suburban country, not a mountain railway.
#
# WHY IT ADDS TO ZERO
#
# A circuit has to. A train that goes round a lap and arrives where it started
# is at the height it started at, so the gradients round the lap must sum to
# nothing, and a profile that does not is not a railway - it is an error the
# simulator will happily run and quietly get wrong.
#
# Here it closes by construction rather than by arithmetic. The down line
# carries the SAME ten entries as the up line, written the same way round, and
# the builder negates a pair it is asked for in reverse (see
# _gradient_overrides). So every metre climbed on the up line is given back on
# the down line, station for station, and the sum is exactly zero however the
# numbers are edited. Change one and it still closes.
#
# The two horseshoes are level, and have to be: HS_EAST leaves the up line at
# km 35.4 and rejoins the down line at km 34.2, both of them past Gölbaşı 3 on
# the flat stub, so both ends are at the same height. Same for HS_WEST, short of
# Akyurt 1. A turning loop cannot carry a gradient in this schema and does not
# need to.
#
# WHAT IT ACTUALLY CHANGES
#
# Two things, and they pull in opposite directions.
#
# Running time: a train climbing at 15 loses about 0.14 m/s2 of acceleration and
# takes longer to reach line speed; going the other way it gains the same. Over
# a full lap those cancel - the lap sums to zero - so the lap time barely moves.
# What does not cancel is the time lost accelerating away from a stop on a bank,
# because that is where the train is slowest and the gradient bites hardest.
#
# Braking distance: this is the part that matters to signalling. A train
# braking on a falling gradient needs more room, and the driver model asks for
# the steepest fall inside its own braking distance rather than the gradient
# under the nose - so on the 14 down into Akyurt 3 the service brake is worth
# 1.0 - 0.127 = 0.873 m/s2 and the distance from 80 km/h goes from 247 m to
# 283 m. Every system pays that, but they pay it differently: fixed block has
# to hold a whole extra block, moving block only the extra metres.
#
# That is the reason to run this scenario against scenarios/ring rather than
# instead of it. The pair differ in one thing.
#
# ---------------------------------------------------------------------------
# Everything below this line is the circuit's own documentation, unchanged.
# ---------------------------------------------------------------------------
#
# ring - a short, dense circuit worked as a continuous loop.
#
# Thirty-six kilometres of railway each way, joined at both ends by a
# horseshoe, so a train runs out on the up line, round the curve, back on the
# down line, round the other curve, and arrives where it started facing the way
# it set off. Nothing reverses and nobody changes ends: the whole route is one
# direction of travel, and a lap of it is seventy kilometres.
#
#            HS_WEST                                            HS_EAST
#             ,---.                                              ,---.
#   UP  km 0 (     >--- AKYURT 1 ... GOLBASI 3 -------------------<     ) km 36
#   DN        `---<-------------------------------------------------`
#
#             AK1    MA1    GO1    TE1    AK2    MA2    GO2    TE2    AK3    MA3    GO3
#   km        2.6    5.1    8.2    11.0   14.8   17.3   20.8   23.6   27.6   30.7   33.4
#                 X      X      X      X      X      X      X      X      X      X
#
# X is a scissors crossover, one in every gap between neighbouring stations and
# placed at the middle of it, so a train can change lines anywhere on the
# circuit rather than only at the ends.
#
# WHY A RING
#
# The other capacity railways here are out-and-back: a train runs depot to
# depot and stops, and the measurement is of one flight of trains passing over
# a line once. That leaves the ends of the line doing something no signalling
# system can help with - trains standing on a depot road, accelerating from
# rest - and on scenarios/express that despatch sequence turned out to be the
# binding constraint rather than the distance between trains.
#
# A ring has no ends. Every train is always running, the up line and the down
# line are both fully worked at once, and the only places a train waits are
# places another train is in the way. That is the quantity a signalling
# comparison wants.
#
# WHY THE HORSESHOES ARE PART OF THE GEOMETRY
#
# They are ``turning_loops``, not decoration and not crossovers. A crossover
# between the up and the down line lays four movements, because a diagonal can
# be traversed either way; a horseshoe is one-way by construction and lays one.
# See _plan_turning_loops in trainsim/scenario/builder.py.
#
# The curve leaves one road at ``km`` and rejoins the other ``length_m``
# further along the joining road's own direction, so it comes back short of
# where it left:
#
#   HS_EAST  leaves UP at km 35.4, rejoins DN at km 34.2
#   HS_WEST  leaves DN at km  0.6, rejoins UP at km  1.8
#
# The circuit a train actually goes round is therefore UP km 1.8 to 35.4, the
# east curve, DN km 34.2 to 0.6, and the west curve: 69.6 km to the lap, 34.8
# of it in each direction. The rails outside that - the first 1.8 km of the up
# line and the last 600 m of it, and the matching stubs on the down line - are
# not part of any lap. They exist because both ends of a curve need a block
# boundary, and a platform zone is one segment with a stopping mark on it,
# where no signal can stand. ``runs_from_km`` and ``runs_to_km`` open both ends
# so the curves have somewhere to attach.
#
# WHY THE SPEED PROFILE IS IRREGULAR
#
# Line speed is 80 and the profile never sits at it for long: thirty-seven
# sections of roughly a kilometre each, weighted towards the top of the range -
# seventeen at 80, eleven at 70, five at 60, four at 50. The mean of the limits
# is 71 and a train that has to brake for each change and accelerate out of it
# achieves rather less, which is the point. A flat 80 would make this a test of
# nothing but the following distance; a sawtooth would make every train brake in
# the same places and measure the geography instead of the signalling. An
# irregular profile puts the two together, which is what a real railway does.
#
# Nothing here braces a crossover: the crossover carries its own 40 and that
# limit belongs to the train taking it. A train staying on its own line runs
# past the pointwork at whatever the profile allows.

name: ring-grade

defaults:
  # 700 m rather than the kilometre the other scenarios use. A platform zone is
  # one segment with a stopping mark on it, so no signal can stand inside it,
  # and the tightest gaps here are 2.5 km with an 800 m crossover footprint in
  # the middle: a 1 km zone would leave less than the 339 m a train needs to
  # stop from 80, and a block shorter than that cannot be signalled. 700 m
  # leaves at least 450.
  platform_zone_m: 700
  block_length_m: 900
  max_speed_kmh: 80
  stop_margin_m: 30

stations:
  - {id: AKYURT_1,    name: "Akyurt 1",    km:  2.60}
  - {id: MACUNKOY_1,  name: "Macunköy 1",  km:  5.10}
  - {id: GOLBASI_1,   name: "Gölbaşı 1",   km:  8.20}
  - {id: TEKNOPARK_1, name: "Teknopark 1", km: 11.00}
  - {id: AKYURT_2,    name: "Akyurt 2",    km: 14.80}
  - {id: MACUNKOY_2,  name: "Macunköy 2",  km: 17.30}
  - {id: GOLBASI_2,   name: "Gölbaşı 2",   km: 20.80}
  - {id: TEKNOPARK_2, name: "Teknopark 2", km: 23.60}
  - {id: AKYURT_3,    name: "Akyurt 3",    km: 27.60}
  - {id: MACUNKOY_3,  name: "Macunköy 3",  km: 30.70}
  - {id: GOLBASI_3,   name: "Gölbaşı 3",   km: 33.40}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 80
    block_length_m: 900
    # The rails carry on past the outermost platforms at both ends, because
    # that is where the horseshoes attach and a curve cannot attach inside a
    # platform zone.
    runs_from_km: 0.0
    runs_to_km: 36.0
    serves: [AKYURT_1, MACUNKOY_1, GOLBASI_1, TEKNOPARK_1, AKYURT_2,
             MACUNKOY_2, GOLBASI_2, TEKNOPARK_2, AKYURT_3, MACUNKOY_3,
             GOLBASI_3]
    # Thirty-seven sections of about a kilometre, weighted towards the top of
    # the range and deliberately not in any order. The kilometres are the same
    # for both lines - a limit is a property of the rail - so the down line
    # carries the same list even though its chainage runs the other way.
    speed_limits:
      - {from_km:  0.00, to_km:  1.00, max_speed_kmh: 70}
      - {from_km:  1.00, to_km:  1.95, max_speed_kmh: 80}
      - {from_km:  1.95, to_km:  2.90, max_speed_kmh: 80}
      - {from_km:  2.90, to_km:  3.85, max_speed_kmh: 60}
      - {from_km:  3.85, to_km:  4.80, max_speed_kmh: 70}
      - {from_km:  4.80, to_km:  5.90, max_speed_kmh: 80}
      - {from_km:  5.90, to_km:  6.85, max_speed_kmh: 80}
      - {from_km:  6.85, to_km:  7.70, max_speed_kmh: 50}
      - {from_km:  7.70, to_km:  8.65, max_speed_kmh: 70}
      - {from_km:  8.65, to_km:  9.75, max_speed_kmh: 80}
      - {from_km:  9.75, to_km: 10.70, max_speed_kmh: 80}
      - {from_km: 10.70, to_km: 11.65, max_speed_kmh: 70}
      - {from_km: 11.65, to_km: 12.55, max_speed_kmh: 60}
      - {from_km: 12.55, to_km: 13.65, max_speed_kmh: 80}
      - {from_km: 13.65, to_km: 14.60, max_speed_kmh: 80}
      - {from_km: 14.60, to_km: 15.50, max_speed_kmh: 70}
      - {from_km: 15.50, to_km: 16.45, max_speed_kmh: 80}
      - {from_km: 16.45, to_km: 17.25, max_speed_kmh: 50}
      - {from_km: 17.25, to_km: 18.30, max_speed_kmh: 70}
      - {from_km: 18.30, to_km: 19.35, max_speed_kmh: 80}
      - {from_km: 19.35, to_km: 20.30, max_speed_kmh: 60}
      - {from_km: 20.30, to_km: 21.25, max_speed_kmh: 70}
      - {from_km: 21.25, to_km: 22.35, max_speed_kmh: 80}
      - {from_km: 22.35, to_km: 23.30, max_speed_kmh: 80}
      - {from_km: 23.30, to_km: 24.15, max_speed_kmh: 50}
      - {from_km: 24.15, to_km: 25.10, max_speed_kmh: 70}
      - {from_km: 25.10, to_km: 26.15, max_speed_kmh: 80}
      - {from_km: 26.15, to_km: 27.05, max_speed_kmh: 60}
      - {from_km: 27.05, to_km: 28.00, max_speed_kmh: 70}
      - {from_km: 28.00, to_km: 29.00, max_speed_kmh: 80}
      - {from_km: 29.00, to_km: 30.05, max_speed_kmh: 80}
      - {from_km: 30.05, to_km: 31.00, max_speed_kmh: 70}
      - {from_km: 31.00, to_km: 31.90, max_speed_kmh: 60}
      - {from_km: 31.90, to_km: 32.95, max_speed_kmh: 80}
      - {from_km: 32.95, to_km: 33.85, max_speed_kmh: 50}
      - {from_km: 33.85, to_km: 34.90, max_speed_kmh: 70}
      - {from_km: 34.90, to_km: 36.00, max_speed_kmh: 80}

    # THE PROFILE. Rise per thousand, in the direction each entry is written.
    # The same ten entries appear on the down line, unchanged, because it is
    # the same hill: the builder negates a pair it finds written the other way
    # round, so what climbs out of Akyurt 1 on the up line falls into it on the
    # down. That is also why the lap closes - see WHY IT ADDS TO ZERO above.
    gradients:
      - {from: AKYURT_1,    to: MACUNKOY_1,  grade_permille:   8}
      - {from: MACUNKOY_1,  to: GOLBASI_1,   grade_permille:  15}
      - {from: GOLBASI_1,   to: TEKNOPARK_1, grade_permille:   2}
      - {from: TEKNOPARK_1, to: AKYURT_2,    grade_permille:   6}
      - {from: AKYURT_2,    to: MACUNKOY_2,  grade_permille:  -4}
      - {from: MACUNKOY_2,  to: GOLBASI_2,   grade_permille: -11}
      - {from: GOLBASI_2,   to: TEKNOPARK_2, grade_permille:  -1}
      - {from: TEKNOPARK_2, to: AKYURT_3,    grade_permille: -14}
      - {from: AKYURT_3,    to: MACUNKOY_3,  grade_permille:   3}
      - {from: MACUNKOY_3,  to: GOLBASI_3,   grade_permille:  12}

  - id: DN
    direction: down
    y: 0.4
    max_speed_kmh: 80
    block_length_m: 900
    runs_from_km: 36.0
    runs_to_km: 0.0
    serves: [GOLBASI_3, MACUNKOY_3, AKYURT_3, TEKNOPARK_2, GOLBASI_2,
             MACUNKOY_2, AKYURT_2, TEKNOPARK_1, GOLBASI_1, MACUNKOY_1,
             AKYURT_1]
    speed_limits:
      - {from_km:  0.00, to_km:  1.00, max_speed_kmh: 70}
      - {from_km:  1.00, to_km:  1.95, max_speed_kmh: 80}
      - {from_km:  1.95, to_km:  2.90, max_speed_kmh: 80}
      - {from_km:  2.90, to_km:  3.85, max_speed_kmh: 60}
      - {from_km:  3.85, to_km:  4.80, max_speed_kmh: 70}
      - {from_km:  4.80, to_km:  5.90, max_speed_kmh: 80}
      - {from_km:  5.90, to_km:  6.85, max_speed_kmh: 80}
      - {from_km:  6.85, to_km:  7.70, max_speed_kmh: 50}
      - {from_km:  7.70, to_km:  8.65, max_speed_kmh: 70}
      - {from_km:  8.65, to_km:  9.75, max_speed_kmh: 80}
      - {from_km:  9.75, to_km: 10.70, max_speed_kmh: 80}
      - {from_km: 10.70, to_km: 11.65, max_speed_kmh: 70}
      - {from_km: 11.65, to_km: 12.55, max_speed_kmh: 60}
      - {from_km: 12.55, to_km: 13.65, max_speed_kmh: 80}
      - {from_km: 13.65, to_km: 14.60, max_speed_kmh: 80}
      - {from_km: 14.60, to_km: 15.50, max_speed_kmh: 70}
      - {from_km: 15.50, to_km: 16.45, max_speed_kmh: 80}
      - {from_km: 16.45, to_km: 17.25, max_speed_kmh: 50}
      - {from_km: 17.25, to_km: 18.30, max_speed_kmh: 70}
      - {from_km: 18.30, to_km: 19.35, max_speed_kmh: 80}
      - {from_km: 19.35, to_km: 20.30, max_speed_kmh: 60}
      - {from_km: 20.30, to_km: 21.25, max_speed_kmh: 70}
      - {from_km: 21.25, to_km: 22.35, max_speed_kmh: 80}
      - {from_km: 22.35, to_km: 23.30, max_speed_kmh: 80}
      - {from_km: 23.30, to_km: 24.15, max_speed_kmh: 50}
      - {from_km: 24.15, to_km: 25.10, max_speed_kmh: 70}
      - {from_km: 25.10, to_km: 26.15, max_speed_kmh: 80}
      - {from_km: 26.15, to_km: 27.05, max_speed_kmh: 60}
      - {from_km: 27.05, to_km: 28.00, max_speed_kmh: 70}
      - {from_km: 28.00, to_km: 29.00, max_speed_kmh: 80}
      - {from_km: 29.00, to_km: 30.05, max_speed_kmh: 80}
      - {from_km: 30.05, to_km: 31.00, max_speed_kmh: 70}
      - {from_km: 31.00, to_km: 31.90, max_speed_kmh: 60}
      - {from_km: 31.90, to_km: 32.95, max_speed_kmh: 80}
      - {from_km: 32.95, to_km: 33.85, max_speed_kmh: 50}
      - {from_km: 33.85, to_km: 34.90, max_speed_kmh: 70}
      - {from_km: 34.90, to_km: 36.00, max_speed_kmh: 80}

    # THE PROFILE. Rise per thousand, in the direction each entry is written.
    # The same ten entries appear on the down line, unchanged, because it is
    # the same hill: the builder negates a pair it finds written the other way
    # round, so what climbs out of Akyurt 1 on the up line falls into it on the
    # down. That is also why the lap closes - see WHY IT ADDS TO ZERO above.
    gradients:
      - {from: AKYURT_1,    to: MACUNKOY_1,  grade_permille:   8}
      - {from: MACUNKOY_1,  to: GOLBASI_1,   grade_permille:  15}
      - {from: GOLBASI_1,   to: TEKNOPARK_1, grade_permille:   2}
      - {from: TEKNOPARK_1, to: AKYURT_2,    grade_permille:   6}
      - {from: AKYURT_2,    to: MACUNKOY_2,  grade_permille:  -4}
      - {from: MACUNKOY_2,  to: GOLBASI_2,   grade_permille: -11}
      - {from: GOLBASI_2,   to: TEKNOPARK_2, grade_permille:  -1}
      - {from: TEKNOPARK_2, to: AKYURT_3,    grade_permille: -14}
      - {from: AKYURT_3,    to: MACUNKOY_3,  grade_permille:   3}
      - {from: MACUNKOY_3,  to: GOLBASI_3,   grade_permille:  12}

platforms:
  # One road per line at every station: a single through face at line speed,
  # so a train at the platform blocks the line rather than being passed. That
  # is the case worth measuring here - with a face each side, a following train
  # has one of its own to come into and the platform never binds, which takes
  # the constraint most likely to bite out of the comparison. The second face
  # at each station is commented out below rather than deleted, so putting the
  # island platforms back is a matter of uncommenting them.
  #
  # Akyurt 1 keeps four a side: every lap begins and ends there, so its roads
  # carry twice the traffic of anywhere else and one face would be a terminus
  # bottleneck of exactly the kind a ring exists to avoid.
  - {id: AKYURT_1_UP_1, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.0}
  - {id: AKYURT_1_UP_2, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: AKYURT_1_UP_3, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.8}
  - {id: AKYURT_1_UP_4, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -1.2}
  - {id: AKYURT_1_DN_1, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
  - {id: AKYURT_1_DN_2, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.4}
  - {id: AKYURT_1_DN_3, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.8}
  - {id: AKYURT_1_DN_4, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  1.2}

  - {id: MACUNKOY_1_UP_1, station: MACUNKOY_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.0}
  # - {id: MACUNKOY_1_UP_2, station: MACUNKOY_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: MACUNKOY_1_DN_1, station: MACUNKOY_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
  # - {id: MACUNKOY_1_DN_2, station: MACUNKOY_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.4}

  - {id: GOLBASI_1_UP_1, station: GOLBASI_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.0}
