# ring flat-crossing timetable - generated, do not edit by hand.
#
#   python scenarios/ring/_generate_cross.py 120 240
#
# 12 non-stop circuit services 120 s apart, and 8 crossing services each way
# 240 s apart over the diamond at km 26.60. Every booked time is what that
# service achieves with the other railway absent, so any delay in a run is the
# two railways meeting on the crossing.
#
stock:
  - id: EMU
    name: Ring unit
    length_m: 120
    max_speed_kmh: 90
    max_accel: 1.0
    service_brake: 1.0
    emergency_brake: 1.5
    etcs_level: none
    tims: false

services:

  - id: X01
    name: 07:00 Akyurt 1 circuit non-stop
    stock: EMU
    departure: "07:00:00"
    ready_lead_s: 30
    calls:
