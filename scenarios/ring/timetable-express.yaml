# ring express timetable - generated, do not edit by hand.
#
#   python scenarios/ring/_generate_express.py 120
#
# 12 non-stop laps of the circuit, booked 120 seconds apart, all of them the same
# unit. A lap is two calls: away from Akyurt 1 on the up line, round HS_EAST,
# back down the down line and into Akyurt 1 again, running through the twenty-one
# stations in between. The four faces at Akyurt 1 are used in turn, so what the
# interval has to fit through is the line rather than the terminus. Every booked
# time is what that service achieves with the railway to itself.

stock:
  - id: EMU
    name: Ring unit
    length_m: 120
    max_speed_kmh: 90
    max_accel: 1.0
    service_brake: 1.0
    emergency_brake: 1.5
    etcs_level: none
    tims: false

services:

  - id: X01
    name: 07:00 Akyurt 1 circuit non-stop
    stock: EMU
    departure: "07:00:00"
    ready_lead_s: 30
    calls:
      - {station: AKYURT_1, platform: AKYURT_1_UP_1, departure: "07:00:01", dwell_s: 30}
      - {station: AKYURT_1, platform: AKYURT_1_DN_1, arrival: "07:57:08", dwell_s: 30}

