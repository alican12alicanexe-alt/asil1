    serves: [AKYURT_3, TEKNOPARK_2, GOLBASI_2, MACUNKOY_2, AKYURT_2,
             TEKNOPARK_1, GOLBASI_1, MACUNKOY_1, AKYURT_1]
    speed_limits:
      - {from_km:  0.00, to_km:  1.00, max_speed_kmh: 70}
      - {from_km:  1.00, to_km:  1.95, max_speed_kmh: 80}
