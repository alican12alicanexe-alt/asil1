  - {id: TEKNOPARK_2_DN_2, station: TEKNOPARK_2, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.4}

  - {id: AKYURT_3_UP_1, station: AKYURT_3, track: UP, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
  - {id: AKYURT_3_UP_2, station: AKYURT_3, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: AKYURT_3_DN_1, station: AKYURT_3, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
  - {id: AKYURT_3_DN_2, station: AKYURT_3, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.4}

crossovers:
  # One in every gap between neighbouring stations, at the middle of the gap.
  # Scissors, so a train can cross either way at the same place; 500 m, which
  # is longer than the 246 m a train needs to stop from 80 and therefore
  # signalable, and short enough to sit clear of the platform zones either
  # side. A two-way crossover reaches half a kilometre back on the road it
  # joins as well as half a kilometre forward on the road it leaves, so its
  # footprint is the whole kilometre centred on the km below.
  - {id: XO_AK1_MA1, from: UP, to: DN, km:  4.25, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_MA1_GO1, from: UP, to: DN, km:  7.05, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_GO1_TE1, from: UP, to: DN, km: 10.00, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_TE1_AK2, from: UP, to: DN, km: 13.40, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_AK2_MA2, from: UP, to: DN, km: 16.65, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_MA2_GO2, from: UP, to: DN, km: 19.30, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_GO2_TE2, from: UP, to: DN, km: 22.10, length_m: 500, max_speed_kmh: 40, type: scissors}
  - {id: XO_TE2_AK3, from: UP, to: DN, km: 24.75, length_m: 500, max_speed_kmh: 40, type: scissors}

turning_loops:
  # The two ends of the circuit. Large curves - 1200 m of railway apiece, taken
  # at 50 - rather than the 40 a crossover is worth, because a horseshoe is a
  # sweeping 180 and not a set of points.
  - {id: HS_EAST, from: UP, to: DN, km: 28.4, length_m: 1200, max_speed_kmh: 50}
  - {id: HS_WEST, from: DN, to: UP, km:  0.6, length_m: 1200, max_speed_kmh: 50}
