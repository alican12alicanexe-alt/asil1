crossovers:
  # One in every gap between neighbouring stations, at the middle of the gap.
  # Scissors, so a train can cross either way at the same place; 400 m, which
  # is longer than the 246 m a train needs to stop from 80 and therefore
  # signalable, and short enough to sit clear of the platform zones either
  # side. A two-way crossover reaches its length back on the road it joins as
  # well as forward on the road it leaves, so its footprint is the 800 m
  # centred on the km below.
  - {id: XO_AK1_MA1, from: UP, to: DN, km:  3.85, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_MA1_GO1, from: UP, to: DN, km:  6.65, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_GO1_TE1, from: UP, to: DN, km:  9.60, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_TE1_AK2, from: UP, to: DN, km: 12.90, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_AK2_MA2, from: UP, to: DN, km: 16.05, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_MA2_GO2, from: UP, to: DN, km: 19.05, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_GO2_TE2, from: UP, to: DN, km: 22.20, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_TE2_AK3, from: UP, to: DN, km: 25.60, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_AK3_MA3, from: UP, to: DN, km: 29.15, length_m: 400, max_speed_kmh: 40, type: scissors}
  - {id: XO_MA3_GO3, from: UP, to: DN, km: 32.05, length_m: 400, max_speed_kmh: 40, type: scissors}

  # THE FLAT CROSSING. Four diamonds, because two double-track railways cross
  # each other in four places and each is its own piece of rail: a circuit train
  # and a crossing train cannot both be on one, while two circuit trains on the
  # up and the down line are not in each other's way and neither are the two
  # crossing trains. Pairwise is what a real double junction does; one exclusive
  # zone over the lot would be a bigger railway than this is.
  #
  # A diamond has no points, no length and no speed of its own - nothing is laid
  # for it. All it costs is the exclusivity, and the interlocking holds that
  # under EVERY signalling system here, which is the whole point of measuring it
  # on a ladder that otherwise separates trains four different ways.
  #
  # grade_separated: true on all four turns this into a flyover. That is the
  # control.
  - {id: DIA_CUP_UP, from: CROSS_UP, to: UP, km: 26.60, type: diamond}
  - {id: DIA_CUP_DN, from: CROSS_UP, to: DN, km: 26.60, type: diamond}
  - {id: DIA_CDN_UP, from: CROSS_DN, to: UP, km: 26.60, type: diamond}
  - {id: DIA_CDN_DN, from: CROSS_DN, to: DN, km: 26.60, type: diamond}

turning_loops:
  # The two ends of the circuit. Large curves - 1200 m of railway apiece, taken
  # at 50 - rather than the 40 a crossover is worth, because a horseshoe is a
  # sweeping 180 and not a set of points.
  - {id: HS_EAST, from: UP, to: DN, km: 35.4, length_m: 1200, max_speed_kmh: 50}
  - {id: HS_WEST, from: DN, to: UP, km:  0.6, length_m: 1200, max_speed_kmh: 50}
