  # - {id: GOLBASI_1_UP_2, station: GOLBASI_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: GOLBASI_1_DN_1, station: GOLBASI_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
