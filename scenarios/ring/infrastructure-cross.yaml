      - {from_km: 27.05, to_km: 28.00, max_speed_kmh: 70}
      - {from_km: 28.00, to_km: 29.00, max_speed_kmh: 80}
      - {from_km: 29.00, to_km: 30.05, max_speed_kmh: 80}
      - {from_km: 30.05, to_km: 31.00, max_speed_kmh: 70}
      - {from_km: 31.00, to_km: 31.90, max_speed_kmh: 60}
      - {from_km: 31.90, to_km: 32.95, max_speed_kmh: 80}
      - {from_km: 32.95, to_km: 33.85, max_speed_kmh: 50}
      - {from_km: 33.85, to_km: 34.90, max_speed_kmh: 70}
      - {from_km: 34.90, to_km: 36.00, max_speed_kmh: 80}

  # ------------------------------------------------- the crossing railway
  #
  # A double-track line of its own, laid at y 1.6 and 2.0 - beyond the circuit's
  # two roads and beyond the branch's alignment in infrastructure-merge.yaml, so
  # nothing here can be confused for a connection to either. The rails run past
  # both platforms at each end for the same reason the circuit's do.
  #
  # No speed_limits list. The circuit carries thirty-seven sections of varying
  # limit on purpose, to stop a following train sitting at a constant difference
  # from the one in front; this railway is not being measured for that, and a
  # constant 80 keeps the approach to the diamond the same every time a train
  # makes it.
  - id: CROSS_UP
    direction: up
    y: 1.6
    max_speed_kmh: 80
    block_length_m: 900
    runs_from_km: 20.0
    runs_to_km: 33.0
    serves: [SANAYI, BATIKENT]
    # Short throughout. This railway is the traffic over the diamond, not the
    # thing being measured, and its own signalling should not be what limits
    # how much of it arrives.
    block_lengths:
      - {from: SANAYI, to: BATIKENT, block_length_m: 500}

  - id: CROSS_DN
    direction: down
    y: 2.0
    max_speed_kmh: 80
    block_length_m: 900
    runs_from_km: 33.0
    runs_to_km: 20.0
    serves: [BATIKENT, SANAYI]
    block_lengths:
      - {from: BATIKENT, to: SANAYI, block_length_m: 500}

platforms:
  # One road per line at every station: a single through face at line speed,
  # so a train at the platform blocks the line rather than being passed. That
  # is the case worth measuring here - with a face each side, a following train
  # has one of its own to come into and the platform never binds, which takes
  # the constraint most likely to bite out of the comparison. The second face
  # at each station is commented out below rather than deleted, so putting the
  # island platforms back is a matter of uncommenting them.
  #
  # Akyurt 1 keeps four a side: every lap begins and ends there, so its roads
  # carry twice the traffic of anywhere else and one face would be a terminus
  # bottleneck of exactly the kind a ring exists to avoid.
  - {id: AKYURT_1_UP_1, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.0}
  - {id: AKYURT_1_UP_2, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: AKYURT_1_UP_3, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.8}
  - {id: AKYURT_1_UP_4, station: AKYURT_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -1.2}
  - {id: AKYURT_1_DN_1, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
  - {id: AKYURT_1_DN_2, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.4}
  - {id: AKYURT_1_DN_3, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.8}
  - {id: AKYURT_1_DN_4, station: AKYURT_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  1.2}

  - {id: MACUNKOY_1_UP_1, station: MACUNKOY_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.0}
  # - {id: MACUNKOY_1_UP_2, station: MACUNKOY_1, track: UP, length_m: 240, max_speed_kmh: 80, y_offset: -0.4}
  - {id: MACUNKOY_1_DN_1, station: MACUNKOY_1, track: DN, length_m: 240, max_speed_kmh: 80, y_offset:  0.0}
