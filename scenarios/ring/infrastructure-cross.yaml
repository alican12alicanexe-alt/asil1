# ring + a railway crossing it on the level - a junction with no platform in it.
#
# This is infrastructure.yaml with a second double-track railway laid across it
# and NOTHING ELSE. It is a separate drawing for the reason the branch is:
# every other scenario on this circuit measures a railway whose only constraint
# is a platform, and leaving a crossing on it means those runs carry blocks and
# routes they never book.
#
# Diff it against infrastructure.yaml to see the crossing on its own.
#
# WHY NOT THE SINCAN BRANCH
#
# infrastructure-merge.yaml puts a flat junction on this circuit already, and
# it is the wrong instrument for the question. It joins the circuit AT AKYURT 1,
# which is a station - so what binds there is a platform road, which is the one
# thing this circuit was built to get away from. And only half of it conflicts:
# a branch train joining crosses the down line, a branch train leaving crosses
# nothing, so half the traffic is free and dilutes whatever the junction costs.
#
# WHAT THIS IS INSTEAD
#
# Two railways that cross and share nothing. No connection, no common platform,
# no merged flow beyond the crossing - so the diamond is the ONLY interaction
# in the model, and every movement on both railways conflicts with the other
# railway. Nothing is free and nothing else is being measured.
#
# WHERE
#
# km 26.60. Stations sit at 2.6, 5.1, 8.2, 11.0, 14.8, 17.3, 20.8, 23.6, 27.6,
# 30.7 and 33.4, and the widest gap between two of them is the four kilometres
# from Teknopark 2 to Akyurt 3. The crossover in that gap has its 800 m
# footprint centred on km 25.60, so 26.60 is a kilometre clear of the points
# behind it and a kilometre clear of the platform zone ahead. It is the only
# place on this railway that is clear of both.
#
# That still leaves every train stopping within a kilometre or so of the
# crossing, which is why the flight to run over this drawing is the NON-STOP
# one: with nothing calling anywhere, the diamond is the only thing in the way
# wherever it sits, and the circuit's own express sweep - 39 s under moving
# block, 32 s under virtual coupling, same railway, no crossing - is the
# control that was already measured.
#
# THE CONTROL IN THIS FILE
#
# Set grade_separated: true on the four diamonds and the crossing becomes a
# flyover: same two railways, same trains, same timetable, conflict gone. The
# difference between the two runs is what the flat crossing costs.
#
# A NOTE ON THE KILOMETRES
#
# The crossing railway's stations are given kilometres on the circuit's own
# axis, because a schematic has one axis and no notion of an angle. What makes
# it a separate railway is not where it is drawn but that it shares no rail, no
# platform, no route and no connection with the circuit - only the diamonds.
#
# Thirty-six kilometres of railway each way, joined at both ends by a
# horseshoe, so a train runs out on the up line, round the curve, back on the
# down line, round the other curve, and arrives where it started facing the way
# it set off. Nothing reverses and nobody changes ends: the whole route is one
# direction of travel, and a lap of it is seventy kilometres.
#
#            HS_WEST                                            HS_EAST
#             ,---.                                              ,---.
#   UP  km 0 (     >--- AKYURT 1 ... GOLBASI 3 -------------------<     ) km 36
#   DN        `---<-------------------------------------------------`
#
#             AK1    MA1    GO1    TE1    AK2    MA2    GO2    TE2    AK3    MA3    GO3
#   km        2.6    5.1    8.2    11.0   14.8   17.3   20.8   23.6   27.6   30.7   33.4
#                 X      X      X      X      X      X      X      X      X      X
#
# X is a scissors crossover, one in every gap between neighbouring stations and
# placed at the middle of it, so a train can change lines anywhere on the
# circuit rather than only at the ends.
#
# WHY A RING
#
# The other capacity railways here are out-and-back: a train runs depot to
# depot and stops, and the measurement is of one flight of trains passing over
# a line once. That leaves the ends of the line doing something no signalling
# system can help with - trains standing on a depot road, accelerating from
# rest - and on scenarios/express that despatch sequence turned out to be the
# binding constraint rather than the distance between trains.
#
# A ring has no ends. Every train is always running, the up line and the down
# line are both fully worked at once, and the only places a train waits are
# places another train is in the way. That is the quantity a signalling
# comparison wants.
#
# WHY THE HORSESHOES ARE PART OF THE GEOMETRY
#
# They are ``turning_loops``, not decoration and not crossovers. A crossover
# between the up and the down line lays four movements, because a diagonal can
# be traversed either way; a horseshoe is one-way by construction and lays one.
# See _plan_turning_loops in trainsim/scenario/builder.py.
#
# The curve leaves one road at ``km`` and rejoins the other ``length_m``
# further along the joining road's own direction, so it comes back short of
# where it left:
#
#   HS_EAST  leaves UP at km 35.4, rejoins DN at km 34.2
#   HS_WEST  leaves DN at km  0.6, rejoins UP at km  1.8
#
# The circuit a train actually goes round is therefore UP km 1.8 to 35.4, the
# east curve, DN km 34.2 to 0.6, and the west curve: 69.6 km to the lap, 34.8
# of it in each direction. The rails outside that - the first 1.8 km of the up
# line and the last 600 m of it, and the matching stubs on the down line - are
# not part of any lap. They exist because both ends of a curve need a block
# boundary, and a platform zone is one segment with a stopping mark on it,
# where no signal can stand. ``runs_from_km`` and ``runs_to_km`` open both ends
# so the curves have somewhere to attach.
#
# WHY THE SPEED PROFILE IS IRREGULAR
#
# Line speed is 80 and the profile never sits at it for long: thirty-seven
# sections of roughly a kilometre each, weighted towards the top of the range -
# seventeen at 80, eleven at 70, five at 60, four at 50. The mean of the limits
# is 71 and a train that has to brake for each change and accelerate out of it
# achieves rather less, which is the point. A flat 80 would make this a test of
# nothing but the following distance; a sawtooth would make every train brake in
# the same places and measure the geography instead of the signalling. An
# irregular profile puts the two together, which is what a real railway does.
#
# Nothing here braces a crossover: the crossover carries its own 40 and that
# limit belongs to the train taking it. A train staying on its own line runs
# past the pointwork at whatever the profile allows.

name: ring-cross

defaults:
  # 700 m rather than the kilometre the other scenarios use. A platform zone is
  # one segment with a stopping mark on it, so no signal can stand inside it,
  # and the tightest gaps here are 2.5 km with an 800 m crossover footprint in
  # the middle: a 1 km zone would leave less than the 339 m a train needs to
  # stop from 80, and a block shorter than that cannot be signalled. 700 m
  # leaves at least 450.
  platform_zone_m: 700
  block_length_m: 900
  max_speed_kmh: 80
  stop_margin_m: 30

stations:
  - {id: AKYURT_1,    name: "Akyurt 1",    km:  2.60}
  - {id: MACUNKOY_1,  name: "Macunköy 1",  km:  5.10}
  - {id: GOLBASI_1,   name: "Gölbaşı 1",   km:  8.20}
  - {id: TEKNOPARK_1, name: "Teknopark 1", km: 11.00}
  - {id: AKYURT_2,    name: "Akyurt 2",    km: 14.80}
  - {id: MACUNKOY_2,  name: "Macunköy 2",  km: 17.30}
  - {id: GOLBASI_2,   name: "Gölbaşı 2",   km: 20.80}
  - {id: TEKNOPARK_2, name: "Teknopark 2", km: 23.60}
  - {id: AKYURT_3,    name: "Akyurt 3",    km: 27.60}
  - {id: MACUNKOY_3,  name: "Macunköy 3",  km: 30.70}
  - {id: GOLBASI_3,   name: "Gölbaşı 3",   km: 33.40}

  # The crossing railway. Two stations, far enough either side of the diamond
  # that a train is at line speed when it gets there.
  - {id: SANAYI,      name: "Sanayi",      km: 21.00}
  - {id: BATIKENT,    name: "Batıkent",    km: 32.00}

tracks:
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 80
    block_length_m: 900
    # The rails carry on past the outermost platforms at both ends, because
    # that is where the horseshoes attach and a curve cannot attach inside a
    # platform zone.
    runs_from_km: 0.0
    runs_to_km: 36.0
    serves: [AKYURT_1, MACUNKOY_1, GOLBASI_1, TEKNOPARK_1, AKYURT_2,
             MACUNKOY_2, GOLBASI_2, TEKNOPARK_2, AKYURT_3, MACUNKOY_3,
             GOLBASI_3]
    # Thirty-seven sections of about a kilometre, weighted towards the top of
    # the range and deliberately not in any order. The kilometres are the same
    # for both lines - a limit is a property of the rail - so the down line
    # carries the same list even though its chainage runs the other way.
    # A DIAMOND IS NOT A KILOMETRE OF RAILWAY
    #
    # The circuit's 900 m blocks come out as 1250 m sections in this gap, and
    # exclusivity is held over a whole block: at 900 m a circuit train would
    # take the crossing away from the other railway for a minute at a time,
    # and with a train every 40 s the crossing railway would never get over at
    # all. That is a measurement of the block length, not of the junction.
    #
    # Real diamonds are protected by a short section for exactly this reason.
    # 500 m over the four kilometres either side of the crossing, which is the
    # shortest this line can signal - a train needs 339 m to stop from 80, and
    # a block shorter than its own braking distance cannot show a warning in
    # time. It applies to the flyover control in this same file, so it is not
    # a difference between the two runs.
    block_lengths:
      - {from: TEKNOPARK_2, to: AKYURT_3, block_length_m: 500}
    speed_limits:
      - {from_km:  0.00, to_km:  1.00, max_speed_kmh: 70}
      - {from_km:  1.00, to_km:  1.95, max_speed_kmh: 80}
      - {from_km:  1.95, to_km:  2.90, max_speed_kmh: 80}
      - {from_km:  2.90, to_km:  3.85, max_speed_kmh: 60}
      - {from_km:  3.85, to_km:  4.80, max_speed_kmh: 70}
      - {from_km:  4.80, to_km:  5.90, max_speed_kmh: 80}
      - {from_km:  5.90, to_km:  6.85, max_speed_kmh: 80}
      - {from_km:  6.85, to_km:  7.70, max_speed_kmh: 50}
      - {from_km:  7.70, to_km:  8.65, max_speed_kmh: 70}
      - {from_km:  8.65, to_km:  9.75, max_speed_kmh: 80}
      - {from_km:  9.75, to_km: 10.70, max_speed_kmh: 80}
      - {from_km: 10.70, to_km: 11.65, max_speed_kmh: 70}
      - {from_km: 11.65, to_km: 12.55, max_speed_kmh: 60}
      - {from_km: 12.55, to_km: 13.65, max_speed_kmh: 80}
      - {from_km: 13.65, to_km: 14.60, max_speed_kmh: 80}
      - {from_km: 14.60, to_km: 15.50, max_speed_kmh: 70}
      - {from_km: 15.50, to_km: 16.45, max_speed_kmh: 80}
      - {from_km: 16.45, to_km: 17.25, max_speed_kmh: 50}
      - {from_km: 17.25, to_km: 18.30, max_speed_kmh: 70}
      - {from_km: 18.30, to_km: 19.35, max_speed_kmh: 80}
      - {from_km: 19.35, to_km: 20.30, max_speed_kmh: 60}
      - {from_km: 20.30, to_km: 21.25, max_speed_kmh: 70}
      - {from_km: 21.25, to_km: 22.35, max_speed_kmh: 80}
      - {from_km: 22.35, to_km: 23.30, max_speed_kmh: 80}
      - {from_km: 23.30, to_km: 24.15, max_speed_kmh: 50}
      - {from_km: 24.15, to_km: 25.10, max_speed_kmh: 70}
      - {from_km: 25.10, to_km: 26.15, max_speed_kmh: 80}
      - {from_km: 26.15, to_km: 27.05, max_speed_kmh: 60}
      - {from_km: 27.05, to_km: 28.00, max_speed_kmh: 70}
      - {from_km: 28.00, to_km: 29.00, max_speed_kmh: 80}
      - {from_km: 29.00, to_km: 30.05, max_speed_kmh: 80}
      - {from_km: 30.05, to_km: 31.00, max_speed_kmh: 70}
      - {from_km: 31.00, to_km: 31.90, max_speed_kmh: 60}
      - {from_km: 31.90, to_km: 32.95, max_speed_kmh: 80}
      - {from_km: 32.95, to_km: 33.85, max_speed_kmh: 50}
      - {from_km: 33.85, to_km: 34.90, max_speed_kmh: 70}
      - {from_km: 34.90, to_km: 36.00, max_speed_kmh: 80}

  - id: DN
    direction: down
    y: 0.4
    max_speed_kmh: 80
    block_length_m: 900
    runs_from_km: 36.0
    runs_to_km: 0.0
    serves: [GOLBASI_3, MACUNKOY_3, AKYURT_3, TEKNOPARK_2, GOLBASI_2,
             MACUNKOY_2, AKYURT_2, TEKNOPARK_1, GOLBASI_1, MACUNKOY_1,
             AKYURT_1]
    # A DIAMOND IS NOT A KILOMETRE OF RAILWAY
    #
    # The circuit's 900 m blocks come out as 1250 m sections in this gap, and
    # exclusivity is held over a whole block: at 900 m a circuit train would
    # take the crossing away from the other railway for a minute at a time,
    # and with a train every 40 s the crossing railway would never get over at
    # all. That is a measurement of the block length, not of the junction.
    #
    # Real diamonds are protected by a short section for exactly this reason.
    # 500 m over the four kilometres either side of the crossing, which is the
    # shortest this line can signal - a train needs 339 m to stop from 80, and
    # a block shorter than its own braking distance cannot show a warning in
    # time. It applies to the flyover control in this same file, so it is not
    # a difference between the two runs.
    block_lengths:
      - {from: AKYURT_3, to: TEKNOPARK_2, block_length_m: 500}
    speed_limits:
      - {from_km:  0.00, to_km:  1.00, max_speed_kmh: 70}
      - {from_km:  1.00, to_km:  1.95, max_speed_kmh: 80}
