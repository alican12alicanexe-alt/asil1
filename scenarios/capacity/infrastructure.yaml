crossovers:
  # Eight scissors crossovers, each usable in all four ways: one either side of
  # each of the middle three stations, three kilometres out, and one on the
  # inner side of each depot, three kilometres out again. The depots need only
  # the one - their other side is the buffer stops, and a train that runs to the
  # buffers leaves in the other direction anyway. These are what make both lines
  # reversible: see the spans listed at the top of this file.
  #
  # Three kilometres rather than five. The distance decides how much railway a
  # reversal takes out, and a station's own span is all of it that a reversal
  # AT that station needs; the rest was open line held for nothing. Five gave
  # each station a ten-kilometre span, three gives six.
  - {id: XO_WDEPOT,    from: UP, to: DN, km:  3.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_LINFORD_W, from: UP, to: DN, km: 12.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_LINFORD_E, from: UP, to: DN, km: 18.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_BRAMLEY_W, from: UP, to: DN, km: 27.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_BRAMLEY_E, from: DN, to: UP, km: 33.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_CALDER_W,  from: DN, to: UP, km: 42.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_CALDER_E,  from: DN, to: UP, km: 48.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_EDEPOT,    from: DN, to: UP, km: 57.0, length_m: 900, max_speed_kmh: 40, type: scissors}
