# capacity - the base every signalling comparison is measured against.
#
#   python run.py scenarios/capacity              (live schematic)
#   python run.py scenarios/capacity --headless
#   python run.py scenarios/capacity --check      (the layout, and the plan)
#   python run.py scenarios/capacity --compare    (all six systems, one table)
#   python scenarios/capacity/_sweep_headway.py   (what the line actually holds)
#
# WHAT THIS SCENARIO IS FOR
#
# The question is how much railway a signalling system buys you: fixed block,
# moving block and virtual coupling put trains at different distances from each
# other, and the difference is worth a number rather than an opinion. That
# number is only worth having if nothing else moved, so this scenario is built
# to hold everything else still.
#
#   - one stock type. Every train is the same unit, so no train is ever waiting
#     for a slower one.
#   - one stopping pattern. Every train calls everywhere, with the same dwell.
#   - one geometry. Five stations, fifteen kilometres apart, the same platform
#     arrangement at each of the middle three and the same at each depot.
#   - one line speed, flat throughout. No gradients, no restrictions.
#
# Vary any one of those and you have the next experiment - heterogeneous stock,
# mixed stopping patterns, a speed restriction - and this run is what it gets
# compared against. That is why the base is worth building carefully and then
# leaving alone.
#
# BOTH LINES ARE SIGNALLED BOTH WAYS
#
# Four scissors crossovers bracket five reversible spans, one per station, so
# every platform road has a road each way. Neither direction is the wrong one: a
# line signalled both ways is signalled both ways, and which way it is set is a
# state of the railway. The booked service uses none of it - both flights run on
# their own line throughout - but the capability is there for a diversion, and
# for the reversible working an incident scenario would need.
#
# THE JUNCTIONS ARE THERE AND UNUSED
#
# Two double junctions, at Linford and at Calder, each to an outlying station.
# Nothing is booked over them. A junction changes capacity by taking the main
# line away from main-line trains, and that is a separate measurement from this
# one: putting the pointwork in now means the layout does not change underneath
# the base figures when it is time to take it.
#
# WHAT THE BOOKED SERVICE IS
#
# Eight trains each way, five minutes apart, taking the roads at each station in
# turn. Five minutes is deliberately loose - the base run is meant to complete
# clean, with nothing checked by a signal, so that it says what the railway does
# when it is not fighting itself. The interval it actually holds is what
# _sweep_headway.py measures, one signalling system at a time.
#
# WHAT THE BASE MEASURES, AS BUILT
#
# The booked run finishes 16 of 16 on time under every system, which is the
# point of it: nothing is being obstructed, so any later run that is not clean
# has a reason that can be named. Tighten the interval and the systems separate.
# Measured by _sweep_headway.py, which reports two intervals per system:
#
#   system                all-green   keeps time   each way
#   fixed_block_3aspect      212 s       180 s      17.0 / 20.0 an hour
#   etcs_moving_block        123 s        77 s      29.3 / 46.8
#   virtual_coupling         121 s        68 s      29.8 / 52.9
#
# TWO FIGURES, BECAUSE THEY ANSWER DIFFERENT QUESTIONS
#
# All-green is the strict one: the closest these trains follow each other
# without any of them ever being checked by a signal at all. It is a property
# of the railway, it is what a signalling system is fairly compared on, and it
# is the number to quote for capacity.
#
# Keeps time is the one an operator asks: the closest they follow each other
# with every train still making its booked arrival. It is always the tighter
# figure, and here it is a lot tighter - virtual coupling is all-green at 121 s
# and still punctual at 68 s, which is nearly twice the service.
#
# The gap between them is not a contradiction. A train can be throttled back
# for twenty seconds on a forty-minute run and arrive on the minute, because a
# booked station-to-station time is not an unimpeded one. So a run anywhere
# between the two figures shows every train on time and nothing obviously wrong
# to watch, and is genuinely being held down by the signalling the whole way.
# Both are true. If a run at 90 s looks perfectly normal, that is because at
# 90 s it is: 6 s worst delay, and 336 s of restraint spread over sixteen
# trains that never lose a minute for it.
#
# The rows in between are marked "checked, still on time" rather than
# "degraded", because that is what they are.
#
# To the second, both of them. The sweep runs a coarse list of intervals and
# then halves the bracket between the last row that passed and the first that
# did not, until a single second separates them - so these are boundaries
# rather than the nearest row of a grid.
#
# Three systems, because those are the three the comparison is about. The
# intermediate ETCS levels are still in the registry and _sweep_headway.py will
# still run one if it is named, but they are not fitted for and not swept.
#
# THE TRAIN HAS TO BE FITTED FOR THE SYSTEM
#
# Those figures only mean anything because the sweep changes what the train is
# fitted with along with the signalling. The physical train never changes -
# same length, same power, same brake - but the equipment must, or every system
# runs on the same unfitted unit and reports the same fallback under three
# different names. The fitment is declared in FITMENT in _sweep_headway.py:
#
#   fixed_block_3aspect   no ETCS, no integrity report, no radio link
#   etcs_moving_block     Level 3, integrity report, no radio link
#   virtual_coupling      Level 3, integrity report, radio link
#
# Each system gets what it needs and nothing more. Moving block follows the
# rear of the train in front, so it needs the integrity report - a rear that
# cannot be confirmed cannot be followed, and the system falls back to block
# granularity behind such a train. Virtual coupling needs the radio link on top
# of that, because it plans to stop where the leader will stop rather than
# where the leader currently stands.
#
# So note what `--compare` on this scenario is showing you. It runs the
# scenario's own timetable, and this railway's fleet is unfitted - a 3-aspect
# railway with lineside signals, which is a coherent thing to be. Its table is
# therefore the value of each system TO THIS FLEET. _sweep_headway.py is the
# one that fits the train to the system, and it is the one to quote for
# capacity.
#
# Virtual coupling is two seconds better than moving block here, which is a tie
# in everything but arithmetic, and that is a result rather than a fault: every
# train on this railway calls at every station, so by 123 s the binding
# constraint has moved into the platform, and closing the gap between trains
# cannot help once what they are queueing for is a road to stand on. To
# see virtual coupling do what it is for, the constraint has to be somewhere it
# can still reach - trains that do not all stop everywhere, a mix of speeds, a
# flight closer than a platform can turn round. That is the next experiment,
# and this is what it gets compared against.

name: capacity
description: "Sixty kilometres, a line each way, three stations between two depots - the homogeneous base a signalling comparison is measured against."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0
  start_time: "06:57:00"
  duration_s: 9000
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2000
  route_request_lead_s: 60
  automatic_signals: false
  route_lookahead: 2

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0

view:
  title: "capacity - the comparison base"
  speed: 20
