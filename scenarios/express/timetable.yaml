# express timetable - generated, do not edit by hand.
#
#   python scenarios/express/_generate_timetable.py
#
# 8 trains each way, booked 240 seconds apart, all of them the same unit, none of
# them calling anywhere. Depot to depot in one run: the three stations in
# between are passed at line speed. Every booked time is what that service
# achieves with the railway to itself.
#
# Same stock and same layout as scenarios/capacity - what differs is that
# nothing stops, and the speed profile it runs over.

stock:
  - id: EMU
    name: Line unit
    length_m: 160
    max_speed_kmh: 120
    max_accel: 0.9
    service_brake: 1.0
    emergency_brake: 1.5
    etcs_level: none
    tims: false

services:

  - id: U01
    name: 07:00 West Depot - East Depot
    stock: EMU
    departure: "07:00:00"
    ready_lead_s: 30
    calls:
      - {station: WDEPOT, platform: WDEPOT_UP_1, departure: "07:00:00", dwell_s: 20}
      - {station: EDEPOT, platform: EDEPOT_UP_1, arrival: "07:32:29", dwell_s: 20}

