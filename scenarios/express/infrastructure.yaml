platforms:
  # The through roads sit on the main alignment and the loops fan outward from
  # them - the up loops negative, the down loops positive - so the drawing reads
  # the way a track diagram does, with the through roads in the middle.
  #
  # Road 1 at each intermediate station is a through road at full line speed:
  # a train that is not calling there is not checked for the station. Roads 2
  # and 3 are loops at 60. That is what makes an overtake possible later without
  # the layout having to change.
  - {id: LINFORD_UP_1, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: LINFORD_UP_2, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: LINFORD_UP_3, station: LINFORD, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: LINFORD_DN_1, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: LINFORD_DN_2, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: LINFORD_DN_3, station: LINFORD, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  - {id: BRAMLEY_UP_1, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: BRAMLEY_UP_2, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: BRAMLEY_UP_3, station: BRAMLEY, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: BRAMLEY_DN_1, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: BRAMLEY_DN_2, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: BRAMLEY_DN_3, station: BRAMLEY, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  - {id: CALDER_UP_1, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: CALDER_UP_2, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: CALDER_UP_3, station: CALDER, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: CALDER_DN_1, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 120, y_offset: 0.0}
  - {id: CALDER_DN_2, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: CALDER_DN_3, station: CALDER, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}

  # Four roads at each depot on each line, at 60 rather than the base
  # scenario's two at 40. A depot road is occupied from the moment a train is
  # put on it until it has cleared, and that occupancy divided by the number of
  # roads is a floor under the interval the line can be booked at, whatever the
  # signalling does out on the plain line. Two roads at 40 put that floor above
  # where the cab systems separate from each other, so the sweep measured the
  # depot and reported it as a signalling limit.
  #
  # This is the same mistake the base scenario makes at its platforms, and it is
  # the mistake this scenario exists to avoid: a terminal that despatches a
  # train every thirty seconds needs more than two roads, and there is no
  # argument in holding the measurement back with one that does not.
  - {id: WDEPOT_UP_1, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: WDEPOT_UP_2, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: WDEPOT_UP_3, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: WDEPOT_UP_4, station: WDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -1.2}
  - {id: WDEPOT_DN_1, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: WDEPOT_DN_2, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: WDEPOT_DN_3, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}
  - {id: WDEPOT_DN_4, station: WDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 1.2}
  - {id: EDEPOT_UP_1, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: EDEPOT_UP_2, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.4}
  - {id: EDEPOT_UP_3, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -0.8}
  - {id: EDEPOT_UP_4, station: EDEPOT, track: UP, length_m: 240, max_speed_kmh: 60, y_offset: -1.2}
  - {id: EDEPOT_DN_1, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.0}
  - {id: EDEPOT_DN_2, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.4}
  - {id: EDEPOT_DN_3, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 0.8}
  - {id: EDEPOT_DN_4, station: EDEPOT, track: DN, length_m: 240, max_speed_kmh: 60, y_offset: 1.2}

crossovers:
  # Eight scissors crossovers, each usable in all four ways: one either side of
  # each of the middle three stations, three kilometres out, and one on the
  # inner side of each depot, three kilometres out again. The depots need only
  # the one - their other side is the buffer stops, and a train that runs to the
  # buffers leaves in the other direction anyway. These are what make both lines
  # reversible: see the spans listed at the top of this file.
  #
  # Three kilometres rather than five. The distance decides how much railway a
  # reversal takes out, and a station's own span is all of it that a reversal
  # AT that station needs; the rest was open line held for nothing. Five gave
  # each station a ten-kilometre span, three gives six.
  - {id: XO_WDEPOT,    from: UP, to: DN, km:  3.0, length_m: 900, max_speed_kmh: 40, type: scissors}
  - {id: XO_LINFORD_W, from: UP, to: DN, km: 12.0, length_m: 900, max_speed_kmh: 40, type: scissors}
