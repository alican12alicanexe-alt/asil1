# corridor3 - Milestone 1 reference scenario.
#
# Run it:
#   python run.py scenarios/corridor3              (live schematic)
#   python run.py scenarios/corridor3 --headless   (no window, prints a summary)

name: corridor3
# Kept on one line: the built-in YAML fallback parser does not do folded scalars.
description: "30 km double-track corridor, three stations, conventional three-aspect fixed block signalling, with an overtake in the loop road at Beta."

infrastructure: infrastructure.yaml
timetable: timetable.yaml

simulation:
  dt: 1.0                 # seconds per tick; microscopic
  start_time: "06:55:00"
  duration_s: 4500        # 75 minutes, enough for every service to complete
  strict: false           # true makes a block-exclusivity violation raise

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0   # standing distance kept short of a signal at danger
  stop_tolerance_m: 1.0

view:
  title: "corridor3 - Alpha / Beta / Gamma"
  speed: 30               # simulated seconds per real second at startup
