# corridor3 - a 30 km double-track corridor with three stations.
#
# Written the way an engineer would describe a line: stations at chainages, the
# tracks that serve them, the platforms, and a block length. The loader expands
# this into ~40 segments, blocks and signals - see trainsim/scenario/builder.py.
#
# Block lengths are not uniform, because in practice they are not. Two forces
# set them:
#
#   floor    a driver passing a yellow must stop at the next signal, so
#            block length >= braking distance + reaction distance + margin.
#            At 140 km/h with a 0.7 m/s2 service brake that is ~1180 m.
#   ceiling  minimum headway is roughly the time to clear two blocks plus the
#            train's length, so shorter blocks mean more trains per hour - paid
#            for with more signals.
#
# So the busy inner section Alpha - Beta, where a fast follows a stopper, gets
# shorter blocks; the fast open line Beta - Gamma gets longer ones and fewer
# signals. `python run.py scenarios/corridor3 --check` reports the margin
# against the floor and the headway each stretch implies.

name: corridor3

defaults:
  # The signalled section containing a station's platforms - not the platform
  # itself, which is 250 m. It has to be long enough to brake in from line speed,
  # because a train running *through* a platform meets that section's exit signal
  # at speed, and that signal can be at danger when no route is set beyond it.
  # 400 m would be unsignalable at 140 km/h; real station sections are km-scale.
  platform_zone_m: 1500
  block_length_m: 2000      # nominal; stretches are divided into equal blocks
  max_speed_kmh: 140
  stop_margin_m: 40         # how far short of the platform end a train berths

stations:
  - {id: ALPHA, name: Alpha, km: 0.0}
  - {id: BETA,  name: Beta,  km: 12.0}
  - {id: GAMMA, name: Gamma, km: 30.0}

tracks:
  # Up line: Alpha -> Gamma, drawn as the upper pair of rails.
  - id: UP
    direction: up
    y: 0.0
    max_speed_kmh: 140
    block_length_m: 2000          # default where no stretch override applies
    serves: [ALPHA, BETA, GAMMA]
    block_lengths:
      - {from: ALPHA, to: BETA,  block_length_m: 1500}   # busy: capacity wanted
      - {from: BETA,  to: GAMMA, block_length_m: 2400}   # fast open line

  # Down line: Gamma -> Alpha. Modelled as its own chain of segments rather than
  # as the up line with a direction flag, which keeps every segment one-way.
  - id: DN
    direction: down
    y: 1.4
    max_speed_kmh: 140
    block_length_m: 2000
    serves: [GAMMA, BETA, ALPHA]
    block_lengths:
      - {from: GAMMA, to: BETA,  block_length_m: 2400}
      - {from: BETA,  to: ALPHA, block_length_m: 1500}

platforms:
  - {id: ALPHA_1, station: ALPHA, track: UP, length_m: 250}
  - {id: ALPHA_2, station: ALPHA, track: DN, length_m: 250}

  # Beta is the interesting station: two up roads in parallel. BETA_3 is a loop
  # at 80 km/h where a stopper can stand while a faster service overtakes it on
  # the through platform. Parallel roads need no switch model to be safe - each
  # is its own block, and the single approach block ahead of the divergence can
  # only ever hold one train.
  - {id: BETA_1, station: BETA, track: UP, length_m: 250}
  - {id: BETA_3, station: BETA, track: UP, length_m: 220, max_speed_kmh: 80, y_offset: -0.34}
  - {id: BETA_2, station: BETA, track: DN, length_m: 250}

  - {id: GAMMA_1, station: GAMMA, track: UP, length_m: 250}
  - {id: GAMMA_2, station: GAMMA, track: DN, length_m: 250}
