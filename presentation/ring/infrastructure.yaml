# ring - a short, dense circuit worked as a continuous loop.
#
# Thirty-six kilometres of railway each way, joined at both ends by a
# horseshoe, so a train runs out on the up line, round the curve, back on the
# down line, round the other curve, and arrives where it started facing the way
# it set off. Nothing reverses and nobody changes ends: the whole route is one
# direction of travel, and a lap of it is seventy kilometres.
#
#            HS_WEST                                            HS_EAST
#             ,---.                                              ,---.
#   UP  km 0 (     >--- AKYURT 1 ... GOLBASI 3 -------------------<     ) km 36
#   DN        `---<-------------------------------------------------`
#
#             AK1    MA1    GO1    TE1    AK2    MA2    GO2    TE2    AK3    MA3    GO3
#   km        2.6    5.1    8.2    11.0   14.8   17.3   20.8   23.6   27.6   30.7   33.4
#                 X      X      X      X      X      X      X      X      X      X
#
# X is a scissors crossover, one in every gap between neighbouring stations and
# placed at the middle of it, so a train can change lines anywhere on the
# circuit rather than only at the ends.
#
# WHY A RING
#
# The other capacity railways here are out-and-back: a train runs depot to
# depot and stops, and the measurement is of one flight of trains passing over
# a line once. That leaves the ends of the line doing something no signalling
# system can help with - trains standing on a depot road, accelerating from
# rest - and on scenarios/express that despatch sequence turned out to be the
# binding constraint rather than the distance between trains.
#
# A ring has no ends. Every train is always running, the up line and the down
# line are both fully worked at once, and the only places a train waits are
# places another train is in the way. That is the quantity a signalling
# comparison wants.
#
# WHY THE HORSESHOES ARE PART OF THE GEOMETRY
#
# They are ``turning_loops``, not decoration and not crossovers. A crossover
# between the up and the down line lays four movements, because a diagonal can
# be traversed either way; a horseshoe is one-way by construction and lays one.
# See _plan_turning_loops in trainsim/scenario/builder.py.
#
# The curve leaves one road at ``km`` and rejoins the other ``length_m``
# further along the joining road's own direction, so it comes back short of
# where it left:
#
#   HS_EAST  leaves UP at km 35.4, rejoins DN at km 34.2
#   HS_WEST  leaves DN at km  0.6, rejoins UP at km  1.8
#
# The circuit a train actually goes round is therefore UP km 1.8 to 35.4, the
# east curve, DN km 34.2 to 0.6, and the west curve: 69.6 km to the lap, 34.8
# of it in each direction. The rails outside that - the first 1.8 km of the up
# line and the last 600 m of it, and the matching stubs on the down line - are
# not part of any lap. They exist because both ends of a curve need a block
# boundary, and a platform zone is one segment with a stopping mark on it,
# where no signal can stand. ``runs_from_km`` and ``runs_to_km`` open both ends
# so the curves have somewhere to attach.
#
# WHY THE SPEED PROFILE IS IRREGULAR
#
# Line speed is 80 and the profile never sits at it for long: thirty-seven
# sections of roughly a kilometre each, weighted towards the top of the range -
# seventeen at 80, eleven at 70, five at 60, four at 50. The mean of the limits
# is 71 and a train that has to brake for each change and accelerate out of it
# achieves rather less, which is the point. A flat 80 would make this a test of
# nothing but the following distance; a sawtooth would make every train brake in
# the same places and measure the geography instead of the signalling. An
# irregular profile puts the two together, which is what a real railway does.
#
# Nothing here braces a crossover: the crossover carries its own 40 and that
# limit belongs to the train taking it. A train staying on its own line runs
# past the pointwork at whatever the profile allows.

name: ring

defaults:
  # 700 m rather than the kilometre the other scenarios use. A platform zone is
  # one segment with a stopping mark on it, so no signal can stand inside it,
  # and the tightest gaps here are 2.5 km with an 800 m crossover footprint in
  # the middle: a 1 km zone would leave less than the 339 m a train needs to
  # stop from 80, and a block shorter than that cannot be signalled. 700 m
  # leaves at least 450.
  platform_zone_m: 700
  block_length_m: 900
  max_speed_kmh: 80
  stop_margin_m: 30

