# ring express - the same circuit, run non-stop, to take the platform out of
# the way and leave the signalling.
#
#   python run.py scenarios/ring/scenario-express.yaml --headless
#   python run.py scenarios/ring/scenario-express.yaml --compare    (the ladder)
#   python scenarios/ring/_sweep_express.py virtual_coupling
#   python scenarios/ring/_generate_express.py 120   (rebuild the timetable)
#
# WHAT THIS SCENARIO IS FOR
#
# scenarios/ring ends by naming its own limitation, three times over. Every
# service on it calls at all eleven stations twice a lap, so once the interval
# is tight enough what it has to fit through is a platform road rather than the
# distance between two trains - and a signalling system that closes that
# distance has nothing left to buy. Moving block held 78 s there and virtual
# coupling 71 s, and that 7 s would not move: not for an emergency brake of 1.2
# instead of 1.5, not for a service brake of 0.6 instead of 1.0, not for
# crediting the train in front with its service brake instead of its emergency
# one. A measurement that refuses to respond to its own inputs is measuring
# something else.
#
# This is that experiment run properly, and it is what scenarios/express does
# to scenarios/capacity. Two things change from the ring, and nothing else:
#
#   - nothing stops. A service is booked at Akyurt 1 on the up line and again
#     at Akyurt 1 on the down line; the twenty-one calls between them are run
#     through. That is the circuit less the final horseshoe - it cannot be the
#     whole lap, because a service needs a path from its origin to its
#     destination and there is no path from a platform to itself.
#   - the four faces at Akyurt 1 are used in turn. Everywhere else on this
#     railway the flight is put on one face on purpose, because that is the
#     harder case; here it would be the only case, since one face and thirty
#     seconds standing floors the interval around a minute all by itself -
#     which is the range the answer lives in.
#
# It does NOT put the constraint on the line. That was the intention and it is
# not what happened - see WHAT BINDS IT below, which is measured rather than
# assumed, and which is the more useful half of this scenario.
#
# Same drawing, same unit, same speed profile, same twelve services. So the
# comparison against the ring is a comparison of what trains are asked to do.
#
# WHAT IT SAYS
#
# All-green headway, twelve laps, the same railway both ways:
#
#                          stopping   non-stop   the platform
#   fixed block 3-aspect      148 s      139 s          9 s
#   ETCS L2                   118 s      112 s          6 s
#   Hybrid L3                  88 s       49 s         39 s
#   moving block               78 s       39 s         39 s
#   virtual coupling           71 s       32 s         39 s
#
# Read the last column first. The platform costs the two lineside systems
# almost nothing and the three distance-separated ones exactly thirty-nine
# seconds each. That is the whole finding, and both halves of it say the same
# thing: a railway only pays for the constraint that binds it. Under fixed
# block and L2 the block section is already longer than a platform occupancy,
# so taking the stops away frees six or nine seconds and then runs into the
# block. Under L3, moving block and virtual coupling the following distance is
# shorter than the platform's hold, so the platform is what binds and removing
# it is worth the same 39 s to all three.
#
# Which means the gaps between them survive intact:
#
#                          stopping   non-stop
#   Hybrid L3 -> moving block   10 s       10 s
#   moving block -> virtual      7 s        7 s
#
# Not a bigger share of a smaller number - the identical figures.
#
# WHAT BINDS IT
#
# The all-green headway is the shortest interval at which no train is ever
# checked. So ask where the first check is, at one second under each system's
# own limit. Every one of them, under both systems:
#
#   moving block at 38 s    11 checks   all at chainage 440 m, all at 1.8 km/h
#   virtual coupling at 31 s 11 checks   all at chainage 440 m, all at 1.8 km/h
#
# Eleven checks for twelve services is one per follower. Chainage 440 m is a
# train just starting to move off the platform at Akyurt 1. In seventy
# kilometres of running this flight is never checked on the line at all - the
# number is set entirely by how quickly one train can follow another OFF THE
# PLATFORM, and taking the twenty-one intermediate stops away did not move that
# and could not have.
#
# Which finally explains the seven seconds. At 1.8 km/h a braking distance is
# a tenth of a metre. The term virtual coupling removes is worth nothing at all
# where the binding event happens, so no brake rate could ever have moved it -
# not an emergency brake of 1.2, not a service brake of 0.6, not the convoy
# braking rule. What the seven seconds measures is the difference between two
# systems' rules for starting a train behind one that has just left: moving
# block holds it until the leader's rear is clear by its margin, virtual
# coupling lets it close up until the INTERLOCKING stops it, which is what
# "VC: no route set" in the trace above is. It is a terminus figure and an
# interlocking figure. It is not a following-distance figure.
#
# Below the all-green boundary this stops being true, and the line does start
# to bind:
#
#                        checks   in the first km
#   moving block  38 s       11        100%
#                 30 s     1287         17%
#                 26 s     2953          8%
#   virtual       31 s       11        100%
#   coupling      26 s      148         45%
#                 22 s     1567         14%
#
# So the table above is honest about what it measured and this scenario's own
# title was not. Both flights are platform-limited at their all-green headway;
# what the non-stop one removed is twenty-one platforms out of twenty-two, and
# the twenty-second still sets the number.
#
# The percentage is the number that moves, and the percentage is the number
# papers quote. Both of these runs are honest and they disagree by a factor of
# two, which is worth remembering when reading a capacity figure that comes
# with no stopping pattern attached.
#
# WHAT IT DOES NOT SAY
#
# Twelve trains, one unit, one brake rate, 80 km/h, and a terminus with four
# faces at one end of the flight. Since the binding event turns out to be at
# the terminus and at walking pace, this railway has never measured what the
# literature measures - two trains closing up at line speed, where the term
# virtual coupling removes is worth something. Doing that needs a flight with
# no terminus in it, which this circuit cannot provide while every service
# starts and finishes at Akyurt 1.

name: ring express
description: "The 70 km circuit run non-stop - which turns out to be platform-limited at its all-green headway too, and says so."

infrastructure: infrastructure.yaml
timetable: timetable-express.yaml

simulation:
  dt: 1.0
  start_time: "06:57:00"
  duration_s: 12000
  strict: false

signalling:
  system: fixed_block_3aspect
  sighting_distance_m: 250

interlocking:
  route_request_distance_m: 2000
  route_request_lead_s: 60
  automatic_signals: false
  route_lookahead: 2

driver:
  reaction_time_s: 2.0
  safety_margin_m: 25.0

view:
  title: "ring express - a non-stop lap of the circuit"
  speed: 20
